<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #0f5cc4;
    --danger: #d93025;
    --ok: #188038;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #dde1e6;
    --text: #202124;
    --text-soft: #5f6368;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header.topbar {
    background: linear-gradient(135deg, #1a73e8, #6c3ce9);
    color: #fff;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  header.topbar h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header.topbar .sheet-status { font-size: 12.5px; opacity: 0.95; display:flex; align-items:center; gap:8px; }
  header.topbar .sheet-status a { color: #fff; text-decoration: underline; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display:inline-block; background:#aaa; }
  .dot.on { background: #34d399; }
  .dot.off { background: #f87171; }

  nav.tabs {
    display: flex; gap: 4px; background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 16px; overflow-x: auto;
  }
  nav.tabs button {
    border: none; background: none; padding: 12px 16px; font-size: 14px; cursor: pointer;
    color: var(--text-soft); border-bottom: 3px solid transparent; white-space: nowrap;
    font-family: inherit;
  }
  nav.tabs button.active { color: var(--primary); font-weight: 700; }
  nav.tabs button:disabled { opacity: 0.4; cursor: not-allowed; }

  main { flex: 1; padding: 18px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .card h4 { margin: 0 0 8px; font-size: 13px; color: var(--text-soft); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex-shrink: 0; }
  .grow { flex: 1; min-width: 180px; }

  input[type=text], input[type=number], input[type=url], select, textarea {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 13.5px; font-family: inherit; background: #fff; color: var(--text);
  }
  textarea { width: 100%; resize: vertical; min-height: 70px; }
  input[type=color] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; }

  button {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-family: inherit;
  }
  button:hover { background: #f1f3f4; }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.primary:hover { background: var(--primary-dark); }
  button.danger { color: var(--danger); border-color: #f3c7c2; }
  button.danger:hover { background: #fdecea; }
  button.small { padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  table th, table td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; white-space: nowrap; }
  table th { color: var(--text-soft); font-weight: 600; background: #fafbfc; position: sticky; top: 0; }
  .table-scroll { max-height: 460px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
  .pill.done { background: #e6f4ea; color: var(--ok); }
  .pill.pending { background: #f1f3f4; color: var(--text-soft); }

  .cat-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cat-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 160px;
    cursor: pointer; background: #fff;
  }
  .cat-card:hover { border-color: var(--primary); }
  .cat-card.selected { border-color: var(--primary); background: #eef4fd; box-shadow: 0 0 0 1px var(--primary) inset; }
  .cat-card .name { font-weight: 700; }
  .cat-card .meta { font-size: 11.5px; color: var(--text-soft); margin-top: 3px; }

  /* ---------- 版面編輯器 ---------- */
  .layout-toolbar { display:flex; align-items:center; gap:10px; flex-wrap: wrap; margin-bottom: 12px; }
  .layout-main { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .field-tray { width: 200px; flex-shrink: 0; }
  .field-tray .chip {
    display: block; padding: 8px 10px; margin-bottom: 6px; background: #eef4fd; border: 1px dashed var(--primary);
    border-radius: 6px; cursor: grab; font-size: 12.5px; user-select: none;
  }
  .field-tray .chip:active { cursor: grabbing; }
  .placed-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .placed-item button { padding: 2px 7px; font-size: 11px; }

  .canvas-wrap { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .canvas-toolbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .canvas-stage-center { display: flex; justify-content: center; }
  .editor-stage {
    position: relative; background: #ddd repeating-conic-gradient(#e8e8e8 0% 25%, #fff 0% 50%) 0 0/16px 16px;
    border: 1px solid var(--border); overflow: hidden; touch-action: none;
  }
  .editor-stage img.bg { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }
  .field-box {
    position: absolute; transform: translate(-50%, -50%);
    padding: 2px 6px; white-space: pre; cursor: move; border: 1px dashed transparent;
    line-height: 1.15;
  }
  .field-box:hover { border-color: rgba(26,115,232,0.5); }
  .field-box.selected { border-color: var(--primary); background: rgba(26,115,232,0.08); }

  .props-panel { width: 230px; flex-shrink: 0; }
  .props-form label { display: block; font-size: 12px; color: var(--text-soft); margin: 8px 0 3px; }
  .props-form input, .props-form select { width: 100%; }
  .props-form .two-col { display: flex; gap: 8px; }
  .props-form .two-col > div { flex: 1; }
  .props-empty { color: var(--text-soft); font-size: 12.5px; padding: 20px 0; text-align: center; }

  /* ---------- 產生名牌 ---------- */
  .stat-row { display: flex; gap: 20px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat-box { background: #fafbfc; border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; min-width: 100px; text-align:center; }
  .stat-box .num { font-size: 22px; font-weight: 700; }
  .stat-box .lbl { font-size: 11.5px; color: var(--text-soft); }

  .progress-wrap { margin: 14px 0; display: none; }
  .progress-bar { height: 10px; border-radius: 6px; background: #e8eaed; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--primary); width: 0%; transition: width 0.15s; }
  .progress-label { font-size: 12px; color: var(--text-soft); margin-top: 6px; }

  .gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .gallery .item { width: 120px; }
  .gallery .item img { width: 100%; border: 1px solid var(--border); border-radius: 6px; background:#fff; }
  .gallery .item .fn { font-size: 10.5px; color: var(--text-soft); word-break: break-all; margin-top: 3px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #323232; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, bottom 0.25s; z-index: 999;
  }
  .toast.show { opacity: 1; bottom: 30px; }
  .toast.error { background: #d93025; }

  .export-tab-btn { min-width: 120px; font-weight: 600; }
  .scope-btn { min-width: 110px; font-weight: 500; }
  .hint { font-size: 12px; color: var(--text-soft); line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px 10px; color: var(--text-soft); }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c7cad1; border-radius: 6px; }
</style>
