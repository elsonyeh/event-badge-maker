<script>
/* global google, JSZip */
'use strict';

// ============================================================
// 全域狀態
// ============================================================
var SESSION_KEY_SHEET_IDS = 'nametag_spreadsheet_ids'; // 這個瀏覽器分頁目前連結的試算表 ID 陣列
var LOCAL_KEY_RECENT_SHEETS = 'nametag_recent_spreadsheets'; // 最近連結過的試算表，換瀏覽器分頁/重開瀏覽器都還看得到

var state = {
  connected: false,
  connectedSheets: [],    // [{id, name, url}] 這個瀏覽器分頁目前連結的所有試算表，可以不只一份
  categories: [],         // 所有已連結試算表彙總起來的類別，每筆多帶 spreadsheetId/spreadsheetName 標明來源
  adoptableSheets: [],    // 同上彙總，每筆多帶 spreadsheetId/spreadsheetName
  currentCategory: null,  // 「spreadsheetId::key」組成的識別碼，不能只用 key（不同試算表可能剛好同名）
  headers: [],            // 目前類別的欄位標題 (含系統欄位)
  rows: [],                // 目前類別的名單列
  layout: [],              // 目前類別的版面設定 [{field,xPct,yPct,fontSize,fontFamily,color,bold,align,maxWidthPct}]
  bgImageEl: null,         // 目前已載入的背景 <img>
  bgNativeW: 0,
  bgNativeH: 0,
  selectedFieldIndex: -1,
  selectedFieldIndices: [],
  dirtyLayout: false,
  layoutHistory: [],      // 版面編輯的復原/取消復原歷史紀錄（state.layout 的快照陣列）
  layoutHistoryIndex: -1,
  editingRowIndex: null,   // 名單管理表單目前是「新增」還是在編輯某一列
  checkedRows: new Set(),  // 名單管理裡勾選的列（_rowIndex），供「只處理勾選的」與 PDF 匯出範圍使用
  previewImages: {},       // { fieldName: 'data:...' } 版面編輯器圖片欄位的縮圖（第一列）
  lastGenerated: [],       // [{filename, dataUrl, rowIndex}] 本次瀏覽器工作階段中已產生的名牌，供打包下載
  exportScope: 'all',      // 'all' | 'pending' | 'checked' — 輸出範圍（PNG 與 PDF 共用）
  listFilters: {},          // 名單分欄位篩選 { headerName: keyword, ... }
  _lastCheckedRow: null,    // Shift 快速勾選：記住上一個點擊的 _rowIndex
  cancelGeneration: false  // PNG 渲染迴圈的取消旗標
};

var FONT_CHOICES = [
  { label: '思源黑體 Noto Sans TC', value: "'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif" },
  { label: '思源宋體 Noto Serif TC', value: "'Noto Serif TC','PMingLiU',serif" },
  { label: '微軟正黑體', value: "'Microsoft JhengHei',sans-serif" },
  { label: 'Arial', value: "Arial,Helvetica,sans-serif" },
  { label: 'Times New Roman', value: "'Times New Roman',Times,serif" },
  { label: 'Georgia', value: "Georgia,serif" }
];

var measureCanvas = document.createElement('canvas');
var measureCtx = measureCanvas.getContext('2d');

// ============================================================
// google.script.run 包裝成 Promise
// ============================================================
var _pendingReqs = 0;
function runAsync(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  _pendingReqs++;
  var bar = $('#loadingBar');
  if (bar) bar.style.display = 'block';
  function done() {
    _pendingReqs = Math.max(0, _pendingReqs - 1);
    if (_pendingReqs === 0) { var b = $('#loadingBar'); if (b) b.style.display = 'none'; }
  }
  return new Promise(function (resolve, reject) {
    if (!window.google || !google.script || !google.script.run) {
      done();
      reject(new Error('google.script.run 無法使用（不在 Apps Script 執行環境中）'));
      return;
    }
    google.script.run
      .withSuccessHandler(function (r) { done(); resolve(r); })
      .withFailureHandler(function (err) { done(); reject(new Error(err && err.message ? err.message : String(err))); })[fnName]
      .apply(null, args);
  });
}

// ============================================================
// 小工具
// ============================================================
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg, isError) {
  var el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = 'toast'; }, 3200);
}
function sanitizeFilename(s) {
  return String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim() || 'unnamed';
}
function busy(el, isBusy) { if (el) el.disabled = !!isBusy; }

// ============================================================
// 啟動流程
// ============================================================
window.addEventListener('DOMContentLoaded', function () {
  wireStaticEvents();
  var snapTog = $('#snapToggle'), stage = $('#editorStage');
  if (snapTog && stage) stage.classList.toggle('snap-on', snapTog.checked);
  boot();
});

function boot() {
  ensureFontsLoaded(); // 提早開始下載字型，不阻塞畫面
  if (!getConnectedIds_().length) {
    applyAggregatedInfo_([]);
    return;
  }
  refreshAllConnections();
}

function categoryUid(spreadsheetId, key) { return spreadsheetId + '::' + key; }

// ---- 這個瀏覽器分頁目前連結的試算表清單（sessionStorage，分頁各自獨立） ----
function getConnectedIds_() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY_SHEET_IDS) || '[]'); } catch (e) { return []; }
}
function setConnectedIds_(ids) { sessionStorage.setItem(SESSION_KEY_SHEET_IDS, JSON.stringify(ids)); }
function addConnectedId_(id) {
  var ids = getConnectedIds_();
  if (ids.indexOf(id) === -1) { ids.push(id); setConnectedIds_(ids); }
}
function removeConnectedId_(id) { setConnectedIds_(getConnectedIds_().filter(function (x) { return x !== id; })); }

// ---- 最近連結過的試算表（localStorage，跨分頁、關掉分頁或重開瀏覽器都還在，純粹是方便快速接回） ----
function getRecentSheets_() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY_RECENT_SHEETS) || '[]'); } catch (e) { return []; }
}
function pushRecentSheet_(info) {
  var list = getRecentSheets_().filter(function (s) { return s.id !== info.id; });
  list.unshift({ id: info.id, name: info.name, url: info.url });
  if (list.length > 10) list = list.slice(0, 10);
  localStorage.setItem(LOCAL_KEY_RECENT_SHEETS, JSON.stringify(list));
}
function removeRecentSheet_(id) {
  localStorage.setItem(LOCAL_KEY_RECENT_SHEETS, JSON.stringify(getRecentSheets_().filter(function (s) { return s.id !== id; })));
}

// document.fonts.ready 只會等待「已經觸發過」的字型下載，若字型從未被用過就不會被它等到，
// 所以改成明確呼叫 document.fonts.load() 逐一預先載入版面編輯器會用到的所有字型，
// 並在畫布量測/輸出前 await 這個 Promise，確保 canvas.measureText() 用的是正確字型的字寬。
var FONT_LOAD_PROMISE = null;
function ensureFontsLoaded() {
  if (FONT_LOAD_PROMISE) return FONT_LOAD_PROMISE;
  if (!document.fonts || !document.fonts.load) { FONT_LOAD_PROMISE = Promise.resolve(); return FONT_LOAD_PROMISE; }
  var jobs = [];
  FONT_CHOICES.forEach(function (fc) {
    jobs.push(document.fonts.load('400 16px ' + fc.value).catch(function () {}));
    jobs.push(document.fonts.load('700 16px ' + fc.value).catch(function () {}));
  });
  FONT_LOAD_PROMISE = Promise.all(jobs);
  return FONT_LOAD_PROMISE;
}

// 重新跟伺服器確認「這個分頁記住的每一個試算表 ID」現在還連得到、資料是什麼，
// 全部要完之後統一彙總成 state.categories／state.adoptableSheets（各自標明來自哪份試算表）。
function refreshAllConnections() {
  var ids = getConnectedIds_();
  if (!ids.length) { applyAggregatedInfo_([]); return Promise.resolve(); }
  return Promise.all(ids.map(function (id) { return runAsync('getSpreadsheetInfo', id); }))
    .then(function (results) {
      var validSheets = [];
      var stillValidIds = [];
      results.forEach(function (info, i) {
        if (info.connected) { validSheets.push(info); stillValidIds.push(ids[i]); }
        // 連不到的（例如被刪除、收回權限）就悄悄從清單移除，不用每次開頁都跳錯誤
      });
      if (stillValidIds.length !== ids.length) setConnectedIds_(stillValidIds);
      applyAggregatedInfo_(validSheets);
    }).catch(function (err) { toast(err.message, true); });
}

function applyAggregatedInfo_(sheetsInfoArray) {
  state.connectedSheets = sheetsInfoArray.map(function (s) { return { id: s.id, name: s.name, url: s.url }; });
  state.connected = state.connectedSheets.length > 0;

  var allCats = [], allAdopt = [], seenKeys = {};
  sheetsInfoArray.forEach(function (s) {
    (s.categories || []).forEach(function (c) {
      if (seenKeys[c.key] && seenKeys[c.key] !== s.id) {
        toast('⚠️「' + c.key + '」這個類別代碼在多份已連結的試算表裡重複，只會顯示先連結的那個，建議幫其中一個改代碼', true);
        return;
      }
      seenKeys[c.key] = s.id;
      allCats.push(Object.assign({}, c, { spreadsheetId: s.id, spreadsheetName: s.name }));
    });
    (s.adoptableSheets || []).forEach(function (a) {
      allAdopt.push(Object.assign({}, a, { spreadsheetId: s.id, spreadsheetName: s.name }));
    });
  });
  state.categories = allCats;
  state.adoptableSheets = allAdopt;

  var dot = $('#connDot');
  var label = $('#connLabel');
  if (state.connected) {
    dot.className = 'dot on';
    label.textContent = state.connectedSheets.length === 1
      ? ('已連結：' + state.connectedSheets[0].name)
      : ('已連結 ' + state.connectedSheets.length + ' 份試算表');
  } else {
    dot.className = 'dot off';
    label.textContent = '尚未連結試算表';
  }

  $all('nav.tabs button[data-tab]').forEach(function (btn) {
    if (btn.dataset.tab !== 'settings') btn.disabled = !state.connected;
  });

  renderConnectedSheetsList();
  renderRecentSheets();
  renderTargetSheetSelector();
  renderCategoryGrid();
  renderAdoptableSheets();

  var stillValidCurrent = state.currentCategory && currentCategoryObj();
  if (!stillValidCurrent) {
    if (state.categories.length) {
      selectCategory(categoryUid(state.categories[0].spreadsheetId, state.categories[0].key));
    } else {
      state.currentCategory = null;
      renderLayoutEmpty();
      renderListEmpty();
      renderGenerateEmpty();
    }
  }
}

function renderConnectedSheetsList() {
  var wrap = $('#connectedSheetsList');
  if (!state.connectedSheets.length) {
    wrap.innerHTML = '<div class="hint">尚未連結任何試算表，請在下方連結或建立一個。</div>';
    return;
  }
  wrap.innerHTML = state.connectedSheets.map(function (s) {
    var catsHere = state.categories.filter(function (c) { return c.spreadsheetId === s.id; });
    var catText = catsHere.length ? catsHere.map(function (c) { return c.displayName; }).join('、') : '（還沒有類別）';
    return '<div class="cat-card" style="cursor:default" data-sheet-card="' + escapeHtml(s.id) + '">' +
      '<div class="name"><a href="' + s.url + '" target="_blank">' + escapeHtml(s.name) + '</a></div>' +
      '<div class="meta">類別：' + escapeHtml(catText) + '</div>' +
      '<div class="row" style="margin-top:8px"><button class="small danger" data-disconnect-sheet="' + escapeHtml(s.id) + '">取消連結</button></div>' +
      '</div>';
  }).join('');
  $all('button[data-disconnect-sheet]', wrap).forEach(function (btn) {
    btn.addEventListener('click', function () {
      var s = state.connectedSheets.filter(function (x) { return x.id === btn.dataset.disconnectSheet; })[0];
      if (!confirm('確定要取消連結「' + (s ? s.name : '') + '」嗎？（試算表本身不會被刪除，只是這個分頁暫時不再指向它）')) return;
      removeConnectedId_(btn.dataset.disconnectSheet);
      refreshAllConnections();
      toast('已取消連結');
    });
  });
}

function renderRecentSheets() {
  var section = $('#recentSheetsWrap');
  var wrap = $('#recentSheetsList');
  var recents = getRecentSheets_().filter(function (s) {
    return state.connectedSheets.every(function (cs) { return cs.id !== s.id; });
  }).slice(0, 5);
  if (!recents.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  wrap.innerHTML = recents.map(function (s) {
    return '<button class="small" data-reconnect="' + escapeHtml(s.id) + '" data-url="' + escapeHtml(s.url) + '">🔁 ' + escapeHtml(s.name) + '</button>';
  }).join(' ');
  $all('button[data-reconnect]', wrap).forEach(function (btn) {
    btn.addEventListener('click', function () {
      busy(btn, true);
      runAsync('connectSpreadsheet', btn.dataset.url).then(function (info) {
        if (!info.connected) throw new Error(info.error || '連結失敗');
        addConnectedId_(info.id);
        pushRecentSheet_(info);
        toast('已重新連結「' + info.name + '」');
        return refreshAllConnections();
      }).catch(function (err) {
        toast('這份試算表現在連不到了，已從清單移除：' + err.message, true);
        removeRecentSheet_(btn.dataset.reconnect);
        renderRecentSheets();
      }).finally(function () { busy(btn, false); });
    });
  });
}

function renderTargetSheetSelector() {
  var row = $('#targetSheetRow');
  var sel = $('#newCatTargetSheet');
  if (state.connectedSheets.length <= 1) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  var prevValue = sel.value;
  sel.innerHTML = state.connectedSheets.map(function (s) { return '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</option>'; }).join('');
  var stillThere = state.connectedSheets.some(function (s) { return s.id === prevValue; });
  sel.value = stillThere ? prevValue : state.connectedSheets[state.connectedSheets.length - 1].id; // 預設選最後加入的那份
}

function getTargetSpreadsheetId_() {
  if (!state.connectedSheets.length) return null;
  if (state.connectedSheets.length === 1) return state.connectedSheets[0].id;
  var sel = $('#newCatTargetSheet');
  return sel && sel.value ? sel.value : state.connectedSheets[0].id;
}

// ============================================================
// 頁籤切換
// ============================================================
function wireStaticEvents() {
  $all('nav.tabs button[data-tab]').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
  });

  // ---- 活動設定 ----
  $('#btnConnect').addEventListener('click', function () {
    var url = $('#sheetUrlInput').value.trim();
    if (!url) { toast('請先貼上試算表連結', true); return; }
    busy($('#btnConnect'), true);
    runAsync('connectSpreadsheet', url).then(function (info) {
      if (!info.connected) throw new Error(info.error || '連結失敗');
      addConnectedId_(info.id);
      pushRecentSheet_(info);
      $('#sheetUrlInput').value = '';
      toast('已連結「' + info.name + '」');
      return refreshAllConnections();
    }).catch(function (err) { toast(err.message, true); }).finally(function () { busy($('#btnConnect'), false); });
  });

  $('#btnCreateNew').addEventListener('click', function () {
    var name = prompt('請輸入新活動試算表的名稱：', '名牌活動_' + new Date().toISOString().slice(0, 10));
    if (name === null) return;
    runAsync('createNewEventSpreadsheet', name).then(function (info) {
      addConnectedId_(info.id);
      pushRecentSheet_(info);
      toast('已建立新的活動試算表');
      return refreshAllConnections();
    }).catch(function (err) { toast(err.message, true); });
  });

  function hideCopyPanel() { $('#copyLayoutPanel').style.display = 'none'; }

  $('#btnCopyLayoutCancel').addEventListener('click', hideCopyPanel);
  $('#btnCopyLayoutCancel2').addEventListener('click', hideCopyPanel);

  $('#btnCopyLayoutBack').addEventListener('click', function () {
    $('#copyStep2').style.display = 'none';
    $('#copyStep1').style.display = 'block';
  });

  // 下一步：抓目標欄位 → 顯示欄位對應 UI
  $('#btnCopyLayoutNext').addEventListener('click', function () {
    var targetUid = $('#copyLayoutTarget').value;
    var sourceUid = $('#copyLayoutPanel').dataset.sourceUid;
    var source = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === sourceUid; })[0];
    var target = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === targetUid; })[0];
    if (!source || !target) return;
    busy($('#btnCopyLayoutNext'), true);
    runAsync('getCategoryHeaders', target.spreadsheetId, target.key)
      .then(function (targetHeaders) {
        $('#copyLayoutPanel').dataset.targetUid = targetUid;
        buildFieldMappingUI(source.layout || [], targetHeaders, target.displayName);
        $('#copyStep1').style.display = 'none';
        $('#copyStep2').style.display = 'block';
      })
      .catch(function (err) { toast(err.message, true); })
      .finally(function () { busy($('#btnCopyLayoutNext'), false); });
  });

  // 確認複製：收集對應表 → 呼叫後端
  $('#btnCopyLayoutConfirm').addEventListener('click', function () {
    var targetUid = $('#copyLayoutPanel').dataset.targetUid;
    var sourceUid = $('#copyLayoutPanel').dataset.sourceUid;
    var source = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === sourceUid; })[0];
    var target = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === targetUid; })[0];
    if (!source || !target) return;
    // 收集 <select> 的對應設定
    var fieldMapping = {};
    $all('select[data-source-field]', $('#copyFieldMapping')).forEach(function (sel) {
      fieldMapping[sel.dataset.sourceField] = sel.value || null;
    });
    busy($('#btnCopyLayoutConfirm'), true);
    runAsync('copyLayoutFull', source.spreadsheetId, source.key, target.spreadsheetId, target.key, fieldMapping)
      .then(function (result) { return refreshAllConnections().then(function () { return result; }); })
      .then(function (result) {
        hideCopyPanel();
        var bgMsg = result.backgroundCopied ? '（含背景圖片）' : '';
        toast('已將「' + source.displayName + '」的版面' + bgMsg + '複製到「' + target.displayName + '」');
        if (state.currentCategory === targetUid) loadLayoutEditor(targetUid);
      })
      .catch(function (err) { toast(err.message, true); })
      .finally(function () { busy($('#btnCopyLayoutConfirm'), false); });
  });

  $('#btnAddCategory').addEventListener('click', function () {
    var targetId = getTargetSpreadsheetId_();
    if (!targetId) { toast('請先連結一份試算表', true); return; }
    var key = $('#newCatKey').value.trim();
    var displayName = $('#newCatDisplay').value.trim();
    var headersCsv = $('#newCatHeaders').value.trim();
    if (!key) { toast('請輸入類別代碼（會作為分頁名稱）', true); return; }
    var headers = headersCsv ? headersCsv.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean) : [];
    runAsync('createCategory', targetId, key, displayName, headers).then(function () {
      $('#newCatKey').value = ''; $('#newCatDisplay').value = ''; $('#newCatHeaders').value = '';
      return refreshAllConnections();
    }).then(function () {
      selectCategory(categoryUid(targetId, key));
      toast('已新增類別「' + key + '」');
    }).catch(function (err) { toast(err.message, true); });
  });

  $('#btnSetupDefaults').addEventListener('click', function () {
    var targetId = getTargetSpreadsheetId_();
    if (!targetId) { toast('請先連結一份試算表', true); return; }
    busy($('#btnSetupDefaults'), true);
    runAsync('setupDefaultCategories', targetId).then(function (result) {
      return refreshAllConnections().then(function () {
        toast(result.created.length ? ('已建立：' + result.created.join('、')) : '三個範本類別都已經存在了');
      });
    }).catch(function (err) { toast(err.message, true); }).finally(function () { busy($('#btnSetupDefaults'), false); });
  });

  // ---- 版面編輯器 ----
  $('#layoutCategorySelect').addEventListener('change', function (e) { selectCategory(e.target.value); });
  $('#btnUploadBg').addEventListener('click', function () { $('#bgFileInput').click(); });
  $('#btnDownloadBlankBg').addEventListener('click', downloadBlankBackground);
  $('#bgFileInput').addEventListener('change', handleBgFileChosen);
  $('#btnAutoArrange').addEventListener('click', function () {
    var count = autoArrangeAllFields();
    if (!count) { toast('目前沒有可排版的欄位'); return; }
    renderLayoutStage();
    renderFieldTray();
    toast('已重新排版 ' + count + ' 個欄位');
  });
  $('#btnSaveLayout').addEventListener('click', saveLayoutToServer);
  $('#btnUndoLayout').addEventListener('click', undoLayout);
  $('#btnRedoLayout').addEventListener('click', redoLayout);
  $('#btnCenterH').addEventListener('click', centerSelectedFieldH);
  $('#btnCenterV').addEventListener('click', centerSelectedFieldV);
  $('#btnRemoveField').addEventListener('click', removeSelectedField);
  ['propFontSize', 'propColor', 'propFontFamily', 'propBold', 'propAlign', 'propMaxWidth', 'propX', 'propY', 'propImgWidth', 'propImgHeight']
    .forEach(function (id) {
      var el = $('#' + id);
      if (!el) return;
      el.addEventListener('input', onPropsChanged);
      el.addEventListener('change', pushLayoutHistory);
    });
  $('#propFieldType').addEventListener('change', onPropsChanged);
  $('#propImgUnit').addEventListener('change', function () { renderPropsPanel(); });
  $('#btnLockRatio').addEventListener('click', function () {
    var idx = state.selectedFieldIndex;
    if (idx < 0 || !state.layout[idx]) return;
    var f = state.layout[idx];
    f._lockRatio = !f._lockRatio;
    if (f._lockRatio) {
      f.heightPct = f.widthPct || 100;
      renderLayoutStage();
      renderPropsPanel();
    }
    this.textContent = f._lockRatio ? '🔒' : '🔓';
  });
  $('#snapToggle').addEventListener('change', function () {
    var stage = $('#editorStage');
    if (stage) stage.classList.toggle('snap-on', this.checked);
  });

  // ---- 名單管理 ----
  $('#listCategorySelect').addEventListener('change', function (e) { selectCategory(e.target.value); });
  $('#btnBatchDelete').addEventListener('click', batchDeleteChecked);
  $('#btnAddEntry').addEventListener('click', submitSingleEntry);
  $('#btnCancelEdit').addEventListener('click', resetAddEntryFormMode);
  $('#btnParseBulk').addEventListener('click', parseBulkPaste);
  $('#btnConfirmBulk').addEventListener('click', confirmBulkImport);
  $('#btnUploadExcel').addEventListener('click', function () { $('#excelFileInput').click(); });
  $('#excelFileInput').addEventListener('change', handleExcelFileChosen);

  // ---- 產生名牌 ----
  $('#genCategorySelect').addEventListener('change', function (e) { selectCategory(e.target.value); });
  $('#btnGenerateAndDownload').addEventListener('click', generateBadges);
  $('#btnCancelGen').addEventListener('click', function () {
    state.cancelGeneration = true;
    this.disabled = true;
    this.textContent = '取消中…';
  });
  $('#btnClearAllStatus').addEventListener('click', clearAllGenerationStatus);
  $('#btnOpenFolder').addEventListener('click', openDriveFolder);
  $('#btnLockBadgeRatio').addEventListener('click', toggleBadgeRatioLock);
  $('#btnRestoreBadgeRatio').addEventListener('click', restoreBadgeRatio);
  $('#pdfBadgeW').addEventListener('input', function () {
    if (badgeRatioLocked && badgeLockedAspect) {
      var w = parseFloat(this.value);
      if (w > 0) $('#pdfBadgeH').value = Math.round(w / badgeLockedAspect * 10) / 10;
    }
    updateRestoreBtnState();
    markPdfPreviewStale();
  });
  $('#pdfBadgeH').addEventListener('input', function () {
    if (badgeRatioLocked && badgeLockedAspect) {
      var h = parseFloat(this.value);
      if (h > 0) $('#pdfBadgeW').value = Math.round(h * badgeLockedAspect * 10) / 10;
    }
    updateRestoreBtnState();
    markPdfPreviewStale();
  });
  $all('.scope-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.scope === 'checked' && state.checkedRows.size === 0) return;
      state.exportScope = btn.dataset.scope;
      $all('.scope-btn').forEach(function (b) { b.classList.toggle('primary', b.dataset.scope === state.exportScope); });
    });
  });
  $('#pdfPageSize').addEventListener('change', onPdfPageSizeChanged);
  $('#btnExportPdf').addEventListener('click', exportPdf);
  $('#btnDownloadBlankPdf').addEventListener('click', downloadBlankBadgePdf);
  $('#btnPreviewPdf').addEventListener('click', previewPdfLayout);

  // 當 PDF 設定有任何變動，標記預覽已過期
  ['pdfPageSize', 'pdfOrientation', 'pdfCustomW', 'pdfCustomH',
   'pdfBadgeW', 'pdfBadgeH', 'pdfGap', 'pdfMargin', 'pdfBlankCount'].forEach(function (id) {
    var el = $('#' + id);
    if (el) el.addEventListener('change', markPdfPreviewStale);
  });

  // ---- 匯出頁籤切換（圖片 / PDF） ----
  $all('.export-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      $all('.export-tab-btn').forEach(function (b) { b.classList.remove('primary'); });
      btn.classList.add('primary');
      var tab = btn.dataset.exportTab;
      $('#exportImagePanel').style.display = tab === 'image' ? 'block' : 'none';
      $('#exportPdfPanel').style.display = tab === 'pdf' ? 'block' : 'none';
    });
  });
}

function switchTab(tab) {
  // 離開版面編輯且有未儲存變更時提醒
  var leavingLayout = tab !== 'layout' &&
    $all('nav.tabs button[data-tab]').some(function (b) { return b.classList.contains('active') && b.dataset.tab === 'layout'; });
  if (leavingLayout && state.dirtyLayout) {
    if (!confirm('版面設定尚未儲存，離開後變更將會遺失，確定要離開嗎？')) return;
  }
  $all('nav.tabs button[data-tab]').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
  $all('.tabpanel').forEach(function (p) { p.classList.toggle('active', p.id === 'tab-' + tab); });
  if (!state.currentCategory) return;
  // 名單/狀態可能在其他頁籤被改動過（例如剛產生完名牌），切換頁籤時重新讀取以避免顯示過期資料。
  // 版面編輯頁籤刻意不自動重新讀取，避免蓋掉使用者尚未儲存的拖曳調整。
  if (tab === 'layout') { requestAnimationFrame(layoutStageResize); updateBgInfoDisplay(); }
  else if (tab === 'list') loadNameListTab(state.currentCategory);
  else if (tab === 'generate') loadGenerateTab(state.currentCategory);
}

// 類別選擇（三個分頁共用同一個「目前類別」）
// ============================================================
function renderCategoryGrid() {
  var grid = $('#catGrid');
  var multiSheet = state.connectedSheets.length > 1;
  if (!state.categories.length) {
    grid.innerHTML = '<div class="hint">目前已連結的試算表還沒有任何名牌類別，請在下方新增一個（例如：學員 / 工作人員 / 講師貴賓）。</div>';
  } else {
    grid.innerHTML = state.categories.map(function (c) {
      var uid = categoryUid(c.spreadsheetId, c.key);
      var sel = uid === state.currentCategory ? ' selected' : '';
      var bg = c.bgFileId ? '已設定背景' : '尚未上傳背景';
      var sheetTag = multiSheet ? ('<div class="meta">📄 ' + escapeHtml(c.spreadsheetName) + '</div>') : '';
      var hasLayout = c.layout && c.layout.length > 0;
      return '<div class="cat-card' + sel + '" data-uid="' + escapeHtml(uid) + '">' +
        '<div class="name">' + escapeHtml(c.displayName) + '</div>' +
        '<div class="meta">分頁：' + escapeHtml(c.key) + ' ・ ' + bg + '</div>' + sheetTag +
        '<div class="row" style="margin-top:8px">' +
        '<button class="small" data-rename-uid="' + escapeHtml(uid) + '">✏️ 重新命名</button>' +
        '<button class="small" data-copy-layout-uid="' + escapeHtml(uid) + '"' + (hasLayout ? '' : ' disabled title="尚未設定版面"') + '>📋 複製版面</button>' +
        '<button class="small danger" data-remove-uid="' + escapeHtml(uid) + '">🗑️ 移除</button>' +
        '</div></div>';
    }).join('');
    $all('.cat-card', grid).forEach(function (card) {
      card.addEventListener('click', function () { selectCategory(card.dataset.uid); });
    });
    $all('button[data-rename-uid]', grid).forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var uid = btn.dataset.renameUid;
        var cat = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === uid; })[0];
        if (!cat) return;
        var name = prompt('輸入「' + cat.key + '」的新顯示名稱：', cat.displayName);
        if (name === null || !name.trim()) return;
        runAsync('renameCategoryDisplayName', cat.spreadsheetId, cat.key, name.trim()).then(function () {
          return refreshAllConnections();
        }).then(function () { toast('已更新顯示名稱'); }).catch(function (err) { toast(err.message, true); });
      });
    });
    $all('button[data-remove-uid]', grid).forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var uid = btn.dataset.removeUid;
        var cat = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === uid; })[0];
        if (!cat) return;
        if (!confirm('確定要移除類別「' + cat.key + '」嗎？\n（只會移除設定，底下的「' + cat.key + '」名單分頁不會被刪除，資料還在，之後要用「採用既有分頁」隨時可以接回來）')) return;
        runAsync('removeCategoryFromConfig', cat.spreadsheetId, cat.key).then(function () {
          if (state.currentCategory === uid) state.currentCategory = null;
          return refreshAllConnections();
        }).then(function () { toast('已移除類別「' + cat.key + '」'); }).catch(function (err) { toast(err.message, true); });
      });
    });
    $all('button[data-copy-layout-uid]', grid).forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        showCopyLayoutPicker(btn.dataset.copyLayoutUid);
      });
    });
  }
  // 同步三個下拉選單
  [['#layoutCategorySelect'], ['#listCategorySelect'], ['#genCategorySelect']].forEach(function (arr) {
    var sel = $(arr[0]);
    sel.innerHTML = state.categories.map(function (c) {
      var uid = categoryUid(c.spreadsheetId, c.key);
      var label = c.displayName + (multiSheet ? ('（' + c.spreadsheetName + '）') : '');
      return '<option value="' + escapeHtml(uid) + '">' + escapeHtml(label) + '</option>';
    }).join('');
    if (state.currentCategory) sel.value = state.currentCategory;
  });
}

function showCopyLayoutPicker(sourceUid) {
  var source = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === sourceUid; })[0];
  if (!source) return;
  var targets = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) !== sourceUid; });
  if (!targets.length) { toast('沒有其他類別可以複製到', true); return; }
  var panel = $('#copyLayoutPanel');
  panel.dataset.sourceUid = sourceUid;
  delete panel.dataset.targetUid;
  $('#copyLayoutLabel').textContent = '將「' + source.displayName + '」的版面複製到：';
  $('#copyLayoutTarget').innerHTML = targets.map(function (c) {
    return '<option value="' + escapeHtml(categoryUid(c.spreadsheetId, c.key)) + '">' + escapeHtml(c.displayName) + '</option>';
  }).join('');
  // 每次重開都從第一步開始
  $('#copyStep1').style.display = 'block';
  $('#copyStep2').style.display = 'none';
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function buildFieldMappingUI(sourceLayout, targetHeaders, targetDisplayName) {
  // 只取不重複的欄位名（image 類型的 field 也要對應）
  var seen = {};
  var sourceFields = sourceLayout.filter(function (f) {
    if (!f.field || seen[f.field]) return false;
    seen[f.field] = true;
    return true;
  }).map(function (f) { return f.field; });

  // 系統欄不出現在對應選項裡
  var SYSTEM = ['產生狀態', '產生時間', '圖片連結'];
  var availableHeaders = targetHeaders.filter(function (h) { return SYSTEM.indexOf(h) === -1; });

  if (!sourceFields.length) {
    $('#copyFieldMapping').innerHTML = '<p class="hint">來源版面沒有欄位。</p>';
    return;
  }

  var rows = sourceFields.map(function (srcField) {
    var matched = availableHeaders.indexOf(srcField) !== -1;
    var options = '<option value="">（不套用）</option>' +
      availableHeaders.map(function (h) {
        var sel = h === srcField ? ' selected' : '';
        return '<option value="' + escapeHtml(h) + '"' + sel + '>' + escapeHtml(h) + '</option>';
      }).join('');
    var tag = matched
      ? '<span style="color:var(--ok);font-size:11px;margin-left:4px">✓ 自動配對</span>'
      : '<span style="color:var(--text-soft);font-size:11px;margin-left:4px">⚠ 目標無此欄位</span>';
    return '<tr>' +
      '<td style="padding:5px 10px 5px 0;white-space:nowrap"><strong>' + escapeHtml(srcField) + '</strong>' + tag + '</td>' +
      '<td style="padding:5px 0"><select data-source-field="' + escapeHtml(srcField) + '" style="width:100%">' + options + '</select></td>' +
      '</tr>';
  }).join('');

  $('#copyFieldMapping').innerHTML =
    '<table style="width:100%;font-size:13px;border-collapse:collapse">' +
    '<thead><tr>' +
    '<th style="text-align:left;padding:4px 10px 4px 0;color:var(--text-soft);font-weight:600;border-bottom:1px solid var(--border)">來源欄位</th>' +
    '<th style="text-align:left;padding:4px 0;color:var(--text-soft);font-weight:600;border-bottom:1px solid var(--border)">對應到「' + escapeHtml(targetDisplayName) + '」的欄位</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderAdoptableSheets() {

    wrap.style.display = 'none';
    return;
  }

function selectCategory(uid) {
  if (state.dirtyLayout && state.currentCategory && state.currentCategory !== uid) {
    if (!confirm('目前的版面設定尚未儲存，切換類別將會遺失變更，確定要切換嗎？')) {
      // 還原下拉選單顯示
      $all('select').forEach(function (s) { if (s.id.indexOf('CategorySelect') !== -1) s.value = state.currentCategory; });
      return;
    }
  }
  state.currentCategory = uid;
  state.dirtyLayout = false;
  renderCategoryGrid();
  loadCategoryData(uid);
}

function currentCategoryObj() {
  return state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === state.currentCategory; })[0] || null;
}

function loadCategoryData(uid) {
  if (!uid) return;
  loadLayoutEditor(uid);
  loadNameListTab(uid);
  loadGenerateTab(uid);
}
