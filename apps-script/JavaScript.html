// ============================================================
function renderLayoutEmpty() {
  $('#layoutBody').style.display = 'none';
  $('#layoutEmpty').style.display = 'block';
}

function loadLayoutEditor(uid) {
  var catRef = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === uid; })[0];
  if (!catRef) return Promise.resolve();
  $('#layoutEmpty').style.display = 'none';
  $('#layoutBody').style.display = 'block';
  $('#layoutCategorySelect').value = uid;
  state.selectedFieldIndex = -1;
  state.selectedFieldIndices = [];

  // 立即清空所有與類別相關的狀態，讓使用者立刻看到畫面切換
  state.bgImageEl = null;
  state.bgNativeW = 0; state.bgNativeH = 0;
  state.layout = [];
  state.headers = [];
  state.rows = [];
  state.previewImages = {};
  renderLayoutStage();
  renderFieldTray();
  renderPropsPanel();

  // 顯示畫布 overlay
  var overlay = $('#stageLoadingOverlay');
  if (overlay) overlay.style.display = 'flex';

  return Promise.all([runAsync('getBackgroundImageData', catRef.spreadsheetId, catRef.key), ensureFontsLoaded()]).then(function (results) {
    if (state.currentCategory !== uid) return; // 已切換到其他類別，放棄
    var data = results[0];
    var cat = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === uid; })[0];
    state.layout = (data && data.layout) || (cat ? cat.layout : []) || [];
    state.dirtyLayout = false;
    state.layoutHistory = [cloneLayout(state.layout)];
    state.layoutHistoryIndex = 0;
    updateUndoRedoButtons();
    updateSaveButtonState();
    if (data) {
      state.bgNativeW = data.width;
      state.bgNativeH = data.height;
      var img = new Image();
      img.onload = function () {
        if (state.currentCategory !== uid) return; // 已切換到其他類別，放棄
        state.bgImageEl = img;
        if (overlay) overlay.style.display = 'none';
        updateBgInfoDisplay();
        renderLayoutStage();
      };
      img.onerror = function () { if (overlay) overlay.style.display = 'none'; };
      img.src = 'data:' + data.mimeType + ';base64,' + data.base64;
    } else {
      state.bgImageEl = null;
      state.bgNativeW = 0; state.bgNativeH = 0;
      if (overlay) overlay.style.display = 'none';
      updateBgInfoDisplay();
      renderLayoutStage();
    }
    renderFieldTray();
    renderPropsPanel();
    // 抓第一列的圖片供版面編輯器預覽（包含嵌入型圖片）
    var imgFields = state.layout.filter(function (f) { return f.type === 'image'; }).map(function (f) { return f.field; });
    if (imgFields.length) {
      runAsync('getPreviewImage', catRef.spreadsheetId, catRef.key, imgFields).then(function (previews) {
        if (state.currentCategory !== uid) return;
        state.previewImages = previews || {};
        if (state.bgImageEl) renderLayoutStage();
      }).catch(function () {});
    }
  }).catch(function (err) {
    if (overlay) overlay.style.display = 'none';
    toast(err.message, true);
  });
}

function handleBgFileChosen(e) {
  var file = e.target.files[0];
  if (!file) return;
  var cat = currentCategoryObj();
  if (!cat) { toast('請先選擇一個類別', true); return; }
  var uid = state.currentCategory;
  var img = new Image();
  var reader = new FileReader();
  reader.onload = function () {
    var dataUrl = reader.result;
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var base64 = dataUrl.split(',')[1];
      toast('上傳中，請稍候…');
      runAsync('uploadBackground', cat.spreadsheetId, cat.key, base64, file.type || 'image/png', file.name, w, h)
        .then(function () {
          toast('背景圖片已更新');
          return refreshAllConnections();
        }).then(function () {
          return loadLayoutEditor(uid);
        }).then(function () {
          // 第一次上傳背景、畫布上還完全沒有欄位時，直接幫忙排好一組通用起始位置，
          // 使用者只要微調就好，不用每個欄位都從拖曳開始。
          if (!state.layout.length) {
            var added = autoArrangeMissingFields();
            if (added > 0) {
              renderLayoutStage();
              renderFieldTray();
              toast('已自動排好 ' + added + ' 個欄位的起始位置，檢查後記得按「儲存版面設定」');
            }
          }
        }).catch(function (err) { toast(err.message, true); });
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function downloadBlankBackground() {
  if (!state.bgImageEl || !state.bgImageEl.src) { toast('尚未上傳背景圖片', true); return; }
  var src = state.bgImageEl.src;
  var mimeMatch = src.match(/^data:([^;]+);/);
  var mime = mimeMatch ? mimeMatch[1] : 'image/png';
  var ext = mime.indexOf('jpeg') !== -1 ? 'jpg' : (mime.indexOf('png') !== -1 ? 'png' : 'img');
  var cat = currentCategoryObj();
  var a = document.createElement('a');
  a.href = src;
  a.download = sanitizeFilename(cat ? cat.key : 'badge') + '_空白背景.' + ext;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

var STAGE_MAX_W = 560;
var STAGE_MAX_H = 640;

var SNAP_POSITIONS = [100 / 3, 50, 200 / 3]; // 33.33%, 50%, 66.67%
var SNAP_THRESHOLD = 4; // % 距離內吸附

function snapPct(v) {
  var tog = $('#snapToggle');
  if (!tog || !tog.checked) return Math.round(v * 10) / 10;
  for (var i = 0; i < SNAP_POSITIONS.length; i++) {
    if (Math.abs(v - SNAP_POSITIONS[i]) <= SNAP_THRESHOLD) return SNAP_POSITIONS[i];
  }
  return Math.round(v * 10) / 10;
}

function showSnapLines(xPct, yPct) {
  var tog = $('#snapToggle');
  if (!tog || !tog.checked) return;
  $all('.guide-h').forEach(function (el) {
    var g = parseFloat(el.dataset.guide);
    el.classList.toggle('snapping', Math.abs(yPct - g) <= SNAP_THRESHOLD);
  });
  $all('.guide-v').forEach(function (el) {
    var g = parseFloat(el.dataset.guide);
    el.classList.toggle('snapping', Math.abs(xPct - g) <= SNAP_THRESHOLD);
  });
}

function hideSnapLines() {
  $all('.guide-h, .guide-v').forEach(function (el) { el.classList.remove('snapping'); });
}

function updateBgInfoDisplay() {
  var el = $('#bgInfo');
  if (!el) return;
  var w = state.bgNativeW, h = state.bgNativeH;
  if (!w || !h) { el.innerHTML = '尚未上傳背景圖片'; return; }

  // 比例（化簡）
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  var g = gcd(w, h), rw = w / g, rh = h / g;
  var ratioStr = (rw <= 99 && rh <= 99) ? (rw + ':' + rh) : ((w / h).toFixed(3).replace(/\.?0+$/, '') + ':1');

  // mm（從 PDF 頁籤取得名牌設定，或 badgeOrigW/H）
  var badgeWmm = (badgeOrigW) || parseFloat($('#pdfBadgeW') && $('#pdfBadgeW').value);
  var badgeHmm = (badgeOrigH) || parseFloat($('#pdfBadgeH') && $('#pdfBadgeH').value);
  var mmStr = (badgeWmm && badgeHmm)
    ? '　' + badgeWmm.toFixed(1) + ' × ' + badgeHmm.toFixed(1) + ' mm'
    : '';

  el.innerHTML =
    '<span style="opacity:.6">原始：</span>' +
    '<span>' + w + ' × ' + h + ' px</span>' +
    '<span style="margin-left:10px;opacity:.7">比例 ' + ratioStr + '</span>' +
    (mmStr ? '<span style="margin-left:10px;opacity:.7">' + mmStr + '</span>' : '');
}

function layoutStageScale() {
  if (!state.bgNativeW || !state.bgNativeH) return 1;
  return Math.min(STAGE_MAX_W / state.bgNativeW, STAGE_MAX_H / state.bgNativeH, 1);
}

function layoutStageResize() {
  var stage = $('#editorStage');
  if (!state.bgNativeW) { stage.style.width = '360px'; stage.style.height = '440px'; return; }
  var scale = layoutStageScale();
  stage.style.width = Math.round(state.bgNativeW * scale) + 'px';
  stage.style.height = Math.round(state.bgNativeH * scale) + 'px';
}

function renderLayoutStage() {
  var stage = $('#editorStage');
  layoutStageResize();
  var bgImg = $('#editorBgImg');
  if (state.bgImageEl) {
    bgImg.src = state.bgImageEl.src;
    bgImg.style.display = 'block';
  } else {
    bgImg.removeAttribute('src');
    bgImg.style.display = 'none';
  }
  $all('.field-box', stage).forEach(function (n) { n.remove(); });
  state.layout.forEach(function (field, idx) { stage.appendChild(buildFieldBoxEl(field, idx)); });
}

function sampleValueFor(fieldName) {
  if (state.rows && state.rows.length) {
    var v = state.rows[0][fieldName];
    if (v !== undefined && v !== null && v !== '') return String(v);
  }
  return '[' + fieldName + ']';
}

function buildFieldBoxEl(field, idx) {
  var el = document.createElement('div');
  var inSel = state.selectedFieldIndices.indexOf(idx) !== -1;
  var isAnchor = inSel && state.selectedFieldIndices.length > 1 && idx === state.selectedFieldIndex;
  el.className = 'field-box' + (inSel ? ' selected' : '') + (isAnchor ? ' multi-anchor' : '');
  el.dataset.idx = idx;
  applyFieldBoxStyleAndText(el, field);
  el.addEventListener('pointerdown', function (ev) {
    if (ev.shiftKey) { toggleMultiSelectField(ev, idx); }
    else { startDragExistingField(ev, idx); }
  });
  return el;
}

function applyFieldBoxStyleAndText(el, field) {
  var scale = layoutStageScale();
  el.style.left = field.xPct + '%';
  el.style.top = field.yPct + '%';
  if (field.type === 'image') {
    var wPx = Math.round((field.widthPct || 100) / 100 * (field.natW || 80) * scale);
    var hPx = Math.round((field.heightPct || 100) / 100 * (field.natH || 80) * scale);
    el.style.width = wPx + 'px'; el.style.height = hPx + 'px';
    el.style.display = 'flex'; el.style.flexDirection = 'column';
    el.style.alignItems = 'center'; el.style.justifyContent = 'center';
    el.style.background = '';
    el.style.border = '';
    el.style.padding = '0';
    el.style.color = 'var(--primary)'; el.style.fontWeight = '400';
    el.style.fontSize = Math.max(10, Math.min(wPx, hPx) * 0.3) + 'px';
    el.style.transform = 'translate(-50%,-50%)';
    var sampleUrl = sampleValueFor(field.field);
    if (!sampleUrl || !/^https?:\/\//i.test(sampleUrl)) {
      sampleUrl = (state.previewImages && state.previewImages[field.field]) || '';
    }
    var existingImg = el.querySelector('img');
    if (existingImg && sampleUrl && existingImg.src === sampleUrl) {
      existingImg.style.width  = wPx + 'px';
      existingImg.style.height = hPx + 'px';
      return;
    }
    el.innerHTML = '';
    if (sampleUrl) {
      var previewImg = document.createElement('img');
      previewImg.src = sampleUrl;
      previewImg.style.cssText = 'display:block;object-fit:fill;border-radius:2px;width:' + wPx + 'px;height:' + hPx + 'px';
      var fallbackSpan = document.createElement('span');
      fallbackSpan.innerHTML = '📷<span style="font-size:0.6em;display:block">' + escapeHtml(field.field) + '</span>';
      fallbackSpan.style.display = 'none';
      previewImg.addEventListener('load', function () {
        var natW = previewImg.naturalWidth, natH = previewImg.naturalHeight;
        if (!natW || !natH) return;
        field.natW = natW;
        field.natH = natH;
        var scale = layoutStageScale();
        var newW = Math.round((field.widthPct  || 100) / 100 * natW * scale);
        var newH = Math.round((field.heightPct || 100) / 100 * natH * scale);
        el.style.width  = newW + 'px';
        el.style.height = newH + 'px';
        previewImg.style.width  = newW + 'px';
        previewImg.style.height = newH + 'px';
        if (state.selectedFieldIndex === state.layout.indexOf(field)) {
          var unit = ($('#propImgUnit') && $('#propImgUnit').value) || 'pct';
          var wInput = $('#propImgWidth'), hInput = $('#propImgHeight');
          if (wInput) wInput.value = imgPctToDisplay(field.widthPct || 100, 'W', unit);
          if (hInput) hInput.value = imgPctToDisplay(field.heightPct || 100, 'H', unit);
          var lockBtn = $('#btnLockRatio');
          if (lockBtn) lockBtn.textContent = field._lockRatio ? '🔒' : '🔓';
        }
      });
      previewImg.addEventListener('error', function () {
        previewImg.style.display = 'none';
        fallbackSpan.style.display = '';
      });
      el.appendChild(previewImg);
      el.appendChild(fallbackSpan);
    } else {
      el.innerHTML = '📷<span style="font-size:0.6em;display:block">' + escapeHtml(field.field) + '</span>';
    }
  } else {
    var text = sampleValueFor(field.field);
    var fit = fitText(text, field, state.bgNativeW || 1000);
    el.style.color = field.color || '#000000';
    el.style.fontFamily = field.fontFamily || FONT_CHOICES[0].value;
    el.style.fontWeight = field.bold ? '700' : '400';
    el.style.textAlign = field.align || 'center';
    el.style.fontSize = Math.max(6, fit.fontSize * scale) + 'px';
    el.style.width = ''; el.style.height = ''; el.style.background = ''; el.style.border = '';
    el.style.display = ''; el.style.flexDirection = ''; el.style.padding = '';
    el.innerHTML = fit.lines.map(escapeHtml).join('<br>');
    var anchorShift = field.align === 'left' ? '0%' : (field.align === 'right' ? '-100%' : '-50%');
    el.style.transform = 'translate(' + anchorShift + ', -50%)';
  }
}

// ---- 從欄位工具列拖曳新增 ----
function renderFieldTray() {
  var tray = $('#fieldTray');
  var placedFields = state.layout.map(function (f) { return f.field; });
  var available = (state.headers || []).filter(function (h) {
    return h !== '產生狀態' && h !== '產生時間' && h !== '圖片連結';
  });
  if (!available.length) {
    tray.innerHTML = '<div class="hint">此類別的分頁還沒有欄位標題。</div>';
  } else {
    tray.innerHTML = available.map(function (h) {
      var already = placedFields.indexOf(h) !== -1;
      return '<div class="chip" draggable="false" data-field="' + escapeHtml(h) + '" style="' +
        (already ? 'opacity:.45' : '') + '">' + escapeHtml(h) + (already ? '（已放置）' : '') + '</div>';
    }).join('');
    $all('.chip', tray).forEach(function (chip) {
      chip.addEventListener('pointerdown', function (ev) { startDragNewField(ev, chip.dataset.field); });
    });
  }
  renderPlacedList();
}

function renderPlacedList() {
  var list = $('#placedList');
  if (!state.layout.length) {
    list.innerHTML = '<div class="hint">尚未放置任何欄位，從上方拖曳到畫布上。</div>';
    return;
  }
  list.innerHTML = state.layout.map(function (f, idx) {
    var label = f.type === 'image' ? ('📷 ' + escapeHtml(f.field)) : escapeHtml(f.field);
    return '<div class="placed-item" data-idx="' + idx + '"><span>' + label + '</span>' +
      '<button class="small" data-sel="' + idx + '">編輯</button></div>';
  }).join('');
  $all('button[data-sel]', list).forEach(function (btn) {
    btn.addEventListener('click', function () { selectField(parseInt(btn.dataset.sel, 10)); });
  });
}

function isImageField(fieldName) {
  if (/圖片|照片|photo|image|img|picture|qrcode/i.test(fieldName)) return true;
  var sample = (state.rows && state.rows.length) ? String(state.rows[0][fieldName] || '') : '';
  return /^https?:\/\//i.test(sample);
}

function defaultFieldConfig(fieldName) {
  if (isImageField(fieldName)) {
    return { field: fieldName, type: 'image', xPct: 50, yPct: 50, widthPct: 100, heightPct: 100, _lockRatio: true };
  }
  return {
    field: fieldName, xPct: 50, yPct: 50, fontSize: Math.round((state.bgNativeW || 1000) * 0.07),
    fontFamily: FONT_CHOICES[0].value, color: '#000000', bold: false, align: 'center', maxWidthPct: 80
  };
}

// 猜測哪個欄位是「姓名」性質的主要欄位，自動排版時給它比較大、加粗的預設樣式。
// 只是猜測用的小提示，不影響其他邏輯，猜錯了使用者本來就可以直接調整。
function isPrimaryFieldName(name) {
  var s = String(name || '').trim().toLowerCase();
  return s === '姓名' || s === 'name' || s.indexOf('姓名') !== -1 || s.indexOf('name') !== -1;
}

// 自動排版：文字欄位置於上中段，圖片欄位置於下段，避免重疊。
// 字體大小根據欄位數量與可用空間動態縮小；直/橫向名牌分別計算。
function autoArrangeAllFields() {
  var SYSTEM = ['產生狀態', '產生時間', '圖片連結'];
  var allFields = (state.headers || []).filter(function (h) { return SYSTEM.indexOf(h) === -1; });
  if (!allFields.length) return 0;

  var nativeW = state.bgNativeW || 1000;
  var nativeH = state.bgNativeH || 1000;
  var isPortrait = nativeH >= nativeW;

  var existingMap = {};
  state.layout.forEach(function (f) { existingMap[f.field] = f; });

  var imageFields = allFields.filter(isImageField);
  var textFields  = allFields.filter(function (h) { return !isImageField(h); });
  var hasImages = imageFields.length > 0;
  var nText = textFields.length;
  var nImg  = imageFields.length;

  // 找主要欄位（姓名/name）索引
  var primaryIdx = 0;
  textFields.forEach(function (f, i) { if (isPrimaryFieldName(f)) primaryIdx = i; });

  // 字體基準：取寬高最小值，避免橫向名牌字體過大
  var fontRef = Math.min(nativeW, nativeH);

  // 文字欄位 y 範圍：直向留更多底部空間給圖片
  var textTop = 22;
  var textBot = !hasImages ? 85 : (isPortrait ? 68 : 72);

  // 根據欄位數動態計算字體上限
  // 欄位間距（px）= availH / (nText-1)，字體不超過間距的 72%
  var primaryFontSize, normalFontSize;
  if (nText > 0) {
    var availH  = (textBot - textTop) / 100 * nativeH;
    var spacing  = nText > 1 ? availH / (nText - 1) : availH;
    var maxByGap = nText > 1 ? Math.floor(spacing * 0.72) : Math.round(fontRef * 0.12);
    primaryFontSize = Math.min(Math.round(fontRef * 0.11), maxByGap);
    normalFontSize  = Math.min(Math.round(fontRef * 0.072), Math.round(maxByGap * 0.82));
    primaryFontSize = Math.max(primaryFontSize, 12);
    normalFontSize  = Math.max(normalFontSize,  12);
  }

  var result = [];

  // ---- 文字欄位（按 headers 順序排列） ----
  textFields.forEach(function (field, i) {
    var yPct = nText > 1
      ? textTop + (textBot - textTop) * i / (nText - 1)
      : (textTop + textBot) / 2;
    yPct = Math.round(yPct * 10) / 10;

    if (existingMap[field]) {
      existingMap[field].xPct = 50;
      existingMap[field].yPct = yPct;
      result.push(existingMap[field]);
      return;
    }

    var isPrimary = (i === primaryIdx);
    result.push({
      field: field, xPct: 50, yPct: yPct,
      fontSize: isPrimary ? primaryFontSize : normalFontSize,
      fontFamily: FONT_CHOICES[0].value,
      color: '#000000',
      bold: isPrimary,
      align: 'center',
      maxWidthPct: 80
    });
  });

  // ---- 圖片欄位（置於下方；無文字時排成網格） ----
  var imgY = nText > 0
    ? (isPortrait ? 80 : 82)   // 有文字：直向留更多空間
    : 50;                       // 純圖片：垂直置中

  imageFields.forEach(function (field, i) {
    var xPct, yPct;
    if (nText === 0) {
      // 純圖片模式：網格排列
      var cols = nImg <= 2 ? nImg : Math.ceil(Math.sqrt(nImg));
      var rows = Math.ceil(nImg / cols);
      var col  = i % cols, row = Math.floor(i / cols);
      xPct = cols > 1 ? Math.round((25 + 50 * col / (cols - 1)) * 10) / 10 : 50;
      yPct = rows > 1 ? Math.round((30 + 40 * row / (rows - 1)) * 10) / 10 : 50;
    } else {
      // 有文字：圖片在底部水平分散
      xPct = nImg === 1 ? 50 : Math.round((20 + 60 * i / (nImg - 1)) * 10) / 10;
      yPct = imgY;
    }

    if (existingMap[field]) {
      existingMap[field].xPct = xPct;
      existingMap[field].yPct = yPct;
      result.push(existingMap[field]);
      return;
    }

    result.push({
      field: field, type: 'image',
      xPct: xPct, yPct: yPct,
      widthPct: 100, heightPct: 100, _lockRatio: true
    });
  });

  state.layout = result;
  state.dirtyLayout = true;
  updateSaveButtonState();
  pushLayoutHistory();
  return allFields.length;
}

function startDragNewField(ev, fieldName) {
  ev.preventDefault();
  var stage = $('#editorStage');
  var ghost = document.createElement('div');
  ghost.className = 'field-box';
  ghost.textContent = fieldName;
  ghost.style.left = '50%'; ghost.style.top = '50%'; ghost.style.opacity = '0.85';
  ghost.style.pointerEvents = 'none';
  document.body.appendChild(ghost);
  ghost.style.position = 'fixed';

  function move(e) {
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    ghost.style.transform = 'translate(-50%,-50%)';
  }
  function up(e) {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    ghost.remove();
    var rect = stage.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      var xPct = snapPct(((e.clientX - rect.left) / rect.width) * 100);
      var yPct = snapPct(((e.clientY - rect.top) / rect.height) * 100);
      var cfg = defaultFieldConfig(fieldName);
      cfg.xPct = xPct;
      cfg.yPct = yPct;
      state.layout.push(cfg);
      state.dirtyLayout = true;
      updateSaveButtonState();
      renderLayoutStage();
      renderFieldTray();
      selectField(state.layout.length - 1);
      pushLayoutHistory();
    }
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  move(ev);
}

function startDragExistingField(ev, idx) {
  ev.preventDefault();
  ev.stopPropagation();
  var stage = $('#editorStage');
  var startX = ev.clientX, startY = ev.clientY;
  var moved = false;
  selectField(idx);

  function move(e) {
    var dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    if (!moved) return;
    var rect = stage.getBoundingClientRect();
    var xPct = snapPct(Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100)));
    var yPct = snapPct(Math.min(100, Math.max(0, ((e.clientY - rect.top) / rect.height) * 100)));
    state.layout[idx].xPct = xPct;
    state.layout[idx].yPct = yPct;
    state.dirtyLayout = true;
    updateSaveButtonState();
    var el = $('.field-box[data-idx="' + idx + '"]', stage);
    if (el) applyFieldBoxStyleAndText(el, state.layout[idx]);
    updatePropsPanelPositionOnly();
    showSnapLines(xPct, yPct);
  }
  function up() {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    hideSnapLines();
    if (moved) pushLayoutHistory(); // 只有真的拖動過才記錄一筆歷史，單純點選不算
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function selectField(idx) {
  state.selectedFieldIndex = idx;
  state.selectedFieldIndices = idx >= 0 ? [idx] : [];
  renderLayoutStage();
  renderPropsPanel();
  updateAlignButtonsState();
}

function toggleMultiSelectField(ev, idx) {
  ev.preventDefault(); ev.stopPropagation();
  var arr = state.selectedFieldIndices;
  var pos = arr.indexOf(idx);
  if (pos !== -1) { arr.splice(pos, 1); }
  else { arr.push(idx); state.selectedFieldIndex = idx; }
  if (arr.length === 1) { state.selectedFieldIndex = arr[0]; }
  renderLayoutStage();
  renderPropsPanel();
  updateAlignButtonsState();
}

function updateAlignButtonsState() {
  var panel = $('#multiAlignPanel');
  if (!panel) return;
  var count = state.selectedFieldIndices.length;
  panel.style.display = count >= 2 ? 'block' : 'none';
  var label = $('#multiAlignCount');
  if (label) label.textContent = '已選 ' + count + ' 個欄位，Shift+點選可多選';
}

function getFieldBoundsInPct(idx) {
  var stage = $('#editorStage');
  var el = stage && $('.field-box[data-idx="' + idx + '"]', stage);
  if (!el) return null;
  var sw = stage.offsetWidth, sh = stage.offsetHeight;
  if (!sw || !sh) return null;
  // field-box 以 transform:translate(-50%,-50%) 定位，left/top 是中心點
  var cx = (el.offsetLeft / sw) * 100;
  var cy = (el.offsetTop / sh) * 100;
  var hw = (el.offsetWidth / sw) * 100 / 2;
  var hh = (el.offsetHeight / sh) * 100 / 2;
  return { left: cx - hw, right: cx + hw, top: cy - hh, bottom: cy + hh, cx: cx, cy: cy };
}

function alignSelectedFields(type) {
  var idxs = state.selectedFieldIndices;
  if (idxs.length < 2) return;
  var fields = idxs.map(function (i) { return state.layout[i]; });
  var bounds = idxs.map(function (i) { return getFieldBoundsInPct(i); });
  var xs = fields.map(function (f) { return f.xPct; });
  var ys = fields.map(function (f) { return f.yPct; });

  if (type === 'left') {
    var minLeft = Math.min.apply(null, bounds.filter(Boolean).map(function (b) { return b.left; }));
    idxs.forEach(function (i, n) {
      var b = bounds[n];
      if (b) state.layout[i].xPct = Math.round((minLeft + (b.cx - b.left)) * 10) / 10;
    });
  } else if (type === 'right') {
    var maxRight = Math.max.apply(null, bounds.filter(Boolean).map(function (b) { return b.right; }));
    idxs.forEach(function (i, n) {
      var b = bounds[n];
      if (b) state.layout[i].xPct = Math.round((maxRight - (b.right - b.cx)) * 10) / 10;
    });
  } else if (type === 'top') {
    var minTop = Math.min.apply(null, bounds.filter(Boolean).map(function (b) { return b.top; }));
    idxs.forEach(function (i, n) {
      var b = bounds[n];
      if (b) state.layout[i].yPct = Math.round((minTop + (b.cy - b.top)) * 10) / 10;
    });
  } else if (type === 'bottom') {
    var maxBottom = Math.max.apply(null, bounds.filter(Boolean).map(function (b) { return b.bottom; }));
    idxs.forEach(function (i, n) {
      var b = bounds[n];
      if (b) state.layout[i].yPct = Math.round((maxBottom - (b.bottom - b.cy)) * 10) / 10;
    });
  } else if (type === 'centerH') {
    var val = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
    fields.forEach(function (f) { f.xPct = Math.round(val * 10) / 10; });
  } else if (type === 'centerV') {
    var valV = ys.reduce(function (a, b) { return a + b; }, 0) / ys.length;
    fields.forEach(function (f) { f.yPct = Math.round(valV * 10) / 10; });
  }

  state.dirtyLayout = true;
  updateSaveButtonState();
  renderLayoutStage();
  renderPropsPanel();
  pushLayoutHistory();
}

function renderPropsPanel() {
  var form = $('#propsForm');
  var empty = $('#propsEmpty');
  var idx = state.selectedFieldIndex;
  if (idx < 0 || !state.layout[idx]) {
    form.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  form.style.display = 'block';
  empty.style.display = 'none';
  var f = state.layout[idx];
  var isImage = f.type === 'image';
  $('#propFieldName').textContent = f.field;
  $('#propFieldType').value = isImage ? 'image' : 'text';
  $('#propTextControls').style.display = isImage ? 'none' : 'block';
  $('#propImageControls').style.display = isImage ? 'block' : 'none';
  $('#propImgUnitWrap').style.display   = isImage ? 'block' : 'none';
  if (isImage) {
    var unit = ($('#propImgUnit') && $('#propImgUnit').value) || 'pct';
    var unitLabel = unit === 'px' ? 'px' : unit === 'cm' ? 'cm' : '%';
    $('#lblImgW').textContent = '寬 (' + unitLabel + ')';
    $('#lblImgH').textContent = '高 (' + unitLabel + ')';
    $('#propImgWidth').value = imgPctToDisplay(f.widthPct || 100, 'W', unit);
    $('#propImgHeight').value = imgPctToDisplay(f.heightPct || 100, 'H', unit);
    var lockBtn = $('#btnLockRatio');
    if (lockBtn) lockBtn.textContent = f._lockRatio ? '🔒' : '🔓';
  } else {
    $('#propFontSize').value = f.fontSize;
    $('#propColor').value = f.color || '#000000';
    var famSel = $('#propFontFamily');
    if (!famSel.dataset.filled) {
      famSel.innerHTML = FONT_CHOICES.map(function (fc) { return '<option value="' + fc.value + '">' + fc.label + '</option>'; }).join('');
      famSel.dataset.filled = '1';
    }
    famSel.value = f.fontFamily || FONT_CHOICES[0].value;
    $('#propBold').checked = !!f.bold;
    $('#propAlign').value = f.align || 'center';
    $('#propMaxWidth').value = f.maxWidthPct;
  }
  $('#propX').value = f.xPct;
  $('#propY').value = f.yPct;
}

function updatePropsPanelPositionOnly() {
  var idx = state.selectedFieldIndex;
  if (idx < 0 || !state.layout[idx]) return;
  $('#propX').value = state.layout[idx].xPct;
  $('#propY').value = state.layout[idx].yPct;
}

function onPropsChanged() {
  var idx = state.selectedFieldIndex;
  if (idx < 0 || !state.layout[idx]) return;
  var f = state.layout[idx];
  var newType = $('#propFieldType').value || 'text';
  var typeChanged = newType !== (f.type || 'text');
  if (typeChanged) {
    f.type = newType;
    if (newType === 'image') {
      f.widthPct   = f.widthPct   || 100;
      f.heightPct  = f.heightPct  || 100;
      f._lockRatio = f._lockRatio !== false;
    }
    renderPropsPanel();
  }
  if (f.type === 'image') {
    var unit = ($('#propImgUnit') && $('#propImgUnit').value) || 'pct';
    var newW = imgDisplayToPct(parseFloat($('#propImgWidth').value)  || 0, 'W', unit);
    var newH = imgDisplayToPct(parseFloat($('#propImgHeight').value) || 0, 'H', unit);
    if (f._lockRatio && newW && newW !== f.widthPct) {
      f.widthPct  = newW;
      f.heightPct = newW;
      var hInput = $('#propImgHeight');
      if (hInput) hInput.value = imgPctToDisplay(f.heightPct, 'H', unit);
    } else if (f._lockRatio && newH && newH !== f.heightPct) {
      f.heightPct = newH;
      f.widthPct  = newH;
      var wInput = $('#propImgWidth');
      if (wInput) wInput.value = imgPctToDisplay(f.widthPct, 'W', unit);
    } else {
      f.widthPct  = newW || f.widthPct  || 100;
      f.heightPct = newH || f.heightPct || 100;
    }
  } else {
    f.fontSize = parseFloat($('#propFontSize').value) || f.fontSize;
    f.color = $('#propColor').value;
    f.fontFamily = $('#propFontFamily').value;
    f.bold = $('#propBold').checked;
    f.align = $('#propAlign').value;
    f.maxWidthPct = parseFloat($('#propMaxWidth').value) || f.maxWidthPct;
  }
  f.xPct = parseFloat($('#propX').value);
  f.yPct = parseFloat($('#propY').value);
  state.dirtyLayout = true;
  updateSaveButtonState();
  if (!typeChanged) {
    var stage = $('#editorStage');
    var existingEl = stage && $('.field-box[data-idx="' + idx + '"]', stage);
    if (existingEl) { applyFieldBoxStyleAndText(existingEl, f); existingEl.classList.add('selected'); return; }
  }
  renderLayoutStage();
  var selEl = $('.field-box[data-idx="' + idx + '"]');
  if (selEl) selEl.classList.add('selected');
}

function removeSelectedField() {
  var idx = state.selectedFieldIndex;
  if (idx < 0) return;
  state.layout.splice(idx, 1);
  state.selectedFieldIndex = -1;
  state.selectedFieldIndices = [];
  state.dirtyLayout = true;
  updateSaveButtonState();
  renderLayoutStage();
  renderFieldTray();
  renderPropsPanel();
  pushLayoutHistory();
}

function saveLayoutToServer() {
  var catRef = currentCategoryObj();
  if (!catRef) return;
  busy($('#btnSaveLayout'), true);
  runAsync('saveLayout', catRef.spreadsheetId, catRef.key, state.layout).then(function () {
    state.dirtyLayout = false;
    // 存檔成功後同步更新 state.categories 裡快取的版面資訊，
    // 不然「產生名牌」頁籤讀到的還是存檔前的舊快取，會誤判成「尚未設定版面」。
    var cat = currentCategoryObj();
    if (cat) cat.layout = cloneLayout(state.layout);
    toast('版面設定已儲存');
  }).catch(function (err) { toast(err.message, true); }).finally(function () { updateSaveButtonState(); });
}

// ---- 復原 / 取消復原 ----
function cloneLayout(layout) { return JSON.parse(JSON.stringify(layout || [])); }

function pushLayoutHistory() {
  // 如果曾經按過「上一步」、現在又做了新動作，後面那段「未來」的分支要砍掉，符合一般復原/重做的直覺
  state.layoutHistory = state.layoutHistory.slice(0, state.layoutHistoryIndex + 1);
  state.layoutHistory.push(cloneLayout(state.layout));
  state.layoutHistoryIndex = state.layoutHistory.length - 1;
  updateUndoRedoButtons();
}

function restoreLayoutFromHistory() {
  state.layout = cloneLayout(state.layoutHistory[state.layoutHistoryIndex]);
  state.selectedFieldIndex = -1;
  state.selectedFieldIndices = [];
  state.dirtyLayout = true;
  updateSaveButtonState();
  renderLayoutStage();
  renderFieldTray();
  renderPropsPanel();
  updateUndoRedoButtons();
}

function undoLayout() {
  if (state.layoutHistoryIndex <= 0) return;
  state.layoutHistoryIndex--;
  restoreLayoutFromHistory();
}

function redoLayout() {
  if (state.layoutHistoryIndex >= state.layoutHistory.length - 1) return;
  state.layoutHistoryIndex++;
  restoreLayoutFromHistory();
}

function updateUndoRedoButtons() {
  $('#btnUndoLayout').disabled = state.layoutHistoryIndex <= 0;
  $('#btnRedoLayout').disabled = state.layoutHistoryIndex >= state.layoutHistory.length - 1;
}

function updateSaveButtonState() {
  $('#btnSaveLayout').disabled = !state.dirtyLayout;
}

// ---- 一鍵置中 ----
function centerSelectedFieldH() {
  var idx = state.selectedFieldIndex;
  if (idx < 0 || !state.layout[idx]) return;
  state.layout[idx].xPct = 50;
  state.dirtyLayout = true;
  updateSaveButtonState();
  renderLayoutStage();
  renderPropsPanel();
  pushLayoutHistory();
}

function centerSelectedFieldV() {
  var idx = state.selectedFieldIndex;
  if (idx < 0 || !state.layout[idx]) return;
  state.layout[idx].yPct = 50;
  state.dirtyLayout = true;
  updateSaveButtonState();
  renderLayoutStage();
  renderPropsPanel();
  pushLayoutHistory();
}

// ============================================================
// 文字自動縮放 / 換行 （編輯器預覽與最終輸出共用同一套邏輯）
// ============================================================
function fitText(text, field, nativeW) {
  text = String(text == null ? '' : text);
  var maxWidthPx = (field.maxWidthPct / 100) * nativeW;
  var startSize = field.fontSize;
  var minSize = Math.max(8, field.fontSize * 0.4);

  function widthAt(sz) {
    measureCtx.font = (field.bold ? 'bold ' : '') + sz + 'px ' + field.fontFamily;
    return measureCtx.measureText(text).width;
  }

  if (!text) return { lines: [''], fontSize: startSize };

  var size = startSize;
  while (size > minSize && widthAt(size) > maxWidthPx) {
    size -= Math.max(1, size * 0.03);
  }
  if (widthAt(size) <= maxWidthPx || size <= minSize) {
    if (widthAt(size) <= maxWidthPx) return { lines: [text], fontSize: Math.round(size) };
  }

  // 縮到最小仍放不下 -> 改成最多三行的換行顯示
  size = Math.max(minSize, startSize * 0.8);
  measureCtx.font = (field.bold ? 'bold ' : '') + size + 'px ' + field.fontFamily;
  var lines = [];
  var cur = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    var test = cur + ch;
    if (measureCtx.measureText(test).width > maxWidthPx && cur) {
      lines.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  if (lines.length > 3) {
    lines = lines.slice(0, 3);
    lines[2] = lines[2].slice(0, Math.max(1, lines[2].length - 1)) + '…';
  }
  return { lines: lines, fontSize: Math.round(size) };
}

// ============================================================
// 名單管理
// ============================================================
function renderListEmpty() {
  $('#listBody').style.display = 'none';
  $('#listEmpty').style.display = 'block';
}

function loadNameListTab(uid) {
  var catRef = state.categories.filter(function (c) { return categoryUid(c.spreadsheetId, c.key) === uid; })[0];
  if (!catRef) return;
  $('#listEmpty').style.display = 'none';
  $('#listBody').style.display = 'block';
  $('#listCategorySelect').value = uid;
  runAsync('getNameList', catRef.spreadsheetId, catRef.key).then(function (data) {
    if (state.currentCategory !== uid) return;
    state.headers = data.headers;
    state.rows = data.rows;
    state.checkedRows = new Set();
    renderAddEntryForm();
    resetAddEntryFormMode();
    renderListTable();
    updateCheckedCountUI();
    // 有了名單資料後，把版面裡尚未標記為 image 的欄位重新偵測一次
    var layoutChanged = false;
    state.layout.forEach(function (f) {
      if (f.type !== 'image' && isImageField(f.field)) {
        f.type = 'image';
        if (!f.widthPct)  f.widthPct  = 100;
        if (!f.heightPct) f.heightPct = 100;
        if (f._lockRatio === undefined) f._lockRatio = true;
        layoutChanged = true;
      }
    });
    if (layoutChanged) {
      state.dirtyLayout = true;
      updateSaveButtonState();
    }
    // headers 更新後，重繪欄位匣（可用欄位清單現在才是正確的）
    renderFieldTray();
    // 若版面編輯器背景已載入完畢，重新渲染畫布讓圖片欄位顯示縮圖
    if (state.bgImageEl) renderLayoutStage();
  }).catch(function (err) { toast(err.message, true); });
}

// 舊版相容（仍被外部呼叫）— 有勾選時只處理勾選，否則全部
function filterRowsByScope(rows) {
  if (state.checkedRows.size > 0) {
    return rows.filter(function (r) { return state.checkedRows.has(r._rowIndex); });
  }
  return rows;
}

// 依 state.exportScope 篩選名單（PNG 與 PDF 匯出共用）
function getRowsByScope(rows) {
  if (state.exportScope === 'checked') {
    return state.checkedRows.size > 0
      ? rows.filter(function (r) { return state.checkedRows.has(r._rowIndex); })
      : rows;
  }
  if (state.exportScope === 'pending') {
    return rows.filter(function (r) { return !r['產生狀態']; });
  }
  return rows;
}

function updateCheckedCountUI() {
  var n = state.checkedRows.size;
  $all('.checked-count-label').forEach(function (el) {
    el.textContent = n > 0 ? ('已勾選 ' + n + ' 筆') : '未勾選（預設處理全部名單）';
  });
  var scopeChecked = $('#scopeBtnChecked');
  if (scopeChecked) scopeChecked.disabled = n === 0;
  var batchDel = $('#btnBatchDelete');
  if (batchDel) batchDel.style.display = n > 0 ? '' : 'none';
  // 若勾選清空，且當前範圍是「勾選的」，自動回退到「全部」
  if (n === 0 && state.exportScope === 'checked') {
    state.exportScope = 'all';
    $all('.scope-btn').forEach(function (b) { b.classList.toggle('primary', b.dataset.scope === 'all'); });
  }
}

function batchDeleteChecked() {
  var n = state.checkedRows.size;
  if (n === 0) return;
  if (!confirm('確定要刪除已勾選的 ' + n + ' 筆名單嗎？此動作無法復原。')) return;
  var catRef = currentCategoryObj();
  var ids = [];
  state.checkedRows.forEach(function (v) { ids.push(v); });
  runAsync('deleteNameEntries', catRef.spreadsheetId, catRef.key, ids)
    .then(function (data) {
      state.checkedRows = new Set();
      state._lastCheckedRow = null;
      state.rows = data.rows;
      state.headers = data.headers;
      renderListTable();
      updateCheckedCountUI();
      loadGenerateTab(state.currentCategory);
      toast('已刪除 ' + n + ' 筆名單');
    })
    .catch(function (err) { toast(err.message, true); });
}

// 計算目前篩選後的可見列（純函式）
function getVisibleRows(displayHeaders) {
  var filters = state.listFilters || {};
  var activeFilters = displayHeaders.filter(function (h) { return filters[h] && filters[h].trim(); });
  return state.rows.filter(function (r) {
    return activeFilters.every(function (h) {
      return String(r[h] || '').toLowerCase().indexOf(filters[h].trim().toLowerCase()) !== -1;
    });
  });
}

// 只重建 tbody + 更新計數/全選狀態，不碰篩選框（避免打斷 IME 組字）
function updateListTableBody(wrap, displayHeaders, catRef) {
  var visibleRows = getVisibleRows(displayHeaders);
  var filters = state.listFilters || {};
  var hasFilter = displayHeaders.some(function (h) { return filters[h] && filters[h].trim(); });
  var countText = (hasFilter ? visibleRows.length + ' / ' : '') + state.rows.length + ' 筆';

  var countEl = wrap.querySelector('th.filter-count');
  if (countEl) countEl.textContent = countText;

  var allChecked = visibleRows.length > 0 && visibleRows.every(function (r) { return state.checkedRows.has(r._rowIndex); });
  var checkAll = $('#checkAllRows');
  if (checkAll) checkAll.checked = allChecked;

  var tbody = wrap.querySelector('tbody');
  if (!tbody) return;

  var emptyMsg = hasFilter ? '找不到符合篩選條件的名單。' : '目前還沒有名單，請在下方新增。';
  if (visibleRows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + (displayHeaders.length + 2) + '" class="hint" style="padding:16px;">' + emptyMsg + '</td></tr>';
    return;
  }

  tbody.innerHTML = visibleRows.map(function (r) {
    var checked = state.checkedRows.has(r._rowIndex) ? ' checked' : '';
    var tds = '<td><input type="checkbox" class="row-check" data-row="' + r._rowIndex + '"' + checked + '></td>' +
      displayHeaders.map(function (h) {
        if (h === '產生狀態') {
          return '<td>' + (r[h] ? '<span class="pill done">已產生</span>' : '<span class="pill pending">未產生</span>') + '</td>';
        }
        return '<td>' + escapeHtml(r[h]) + '</td>';
      }).join('');
    var actions = '<td>' +
      '<button class="small" data-act="edit" data-row="' + r._rowIndex + '">編輯</button> ' +
      '<button class="small" data-act="del" data-row="' + r._rowIndex + '">刪除</button> ' +
      (r['產生狀態'] ? '<button class="small" data-act="reset" data-row="' + r._rowIndex + '">重設狀態</button>' : '') +
      '</td>';
    return '<tr>' + tds + actions + '</tr>';
  }).join('');

  // 列層級事件
  $all('.row-check', tbody).forEach(function (cb) {
    cb.addEventListener('click', function (e) {
      var idx = parseInt(cb.dataset.row, 10);
      if (e.shiftKey && state._lastCheckedRow !== null) {
        var lastPos = -1, currPos = -1;
        for (var j = 0; j < visibleRows.length; j++) {
          if (visibleRows[j]._rowIndex === state._lastCheckedRow) lastPos = j;
          if (visibleRows[j]._rowIndex === idx) currPos = j;
        }
        if (lastPos !== -1 && currPos !== -1) {
          var lo = Math.min(lastPos, currPos), hi = Math.max(lastPos, currPos);
          var shouldCheck = cb.checked;
          for (var k = lo; k <= hi; k++) {
            if (shouldCheck) state.checkedRows.add(visibleRows[k]._rowIndex);
            else state.checkedRows.delete(visibleRows[k]._rowIndex);
          }
          state._lastCheckedRow = idx;
          updateListTableBody(wrap, displayHeaders, catRef);
          updateCheckedCountUI();
          return;
        }
      }
      if (cb.checked) state.checkedRows.add(idx); else state.checkedRows.delete(idx);
      state._lastCheckedRow = idx;
      updateCheckedCountUI();
    });
  });
  $all('button[data-act="edit"]', tbody).forEach(function (btn) {
    btn.addEventListener('click', function () { startEditRow(parseInt(btn.dataset.row, 10)); });
  });
  $all('button[data-act="del"]', tbody).forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!confirm('確定要刪除這一列名單嗎？此動作無法復原。')) return;
      runAsync('deleteNameEntry', catRef.spreadsheetId, catRef.key, parseInt(btn.dataset.row, 10)).then(function (data) {
        state.checkedRows.delete(parseInt(btn.dataset.row, 10));
        state.rows = data.rows; state.headers = data.headers;
        renderListTable();
        updateCheckedCountUI();
        if (state.editingRowIndex === parseInt(btn.dataset.row, 10)) resetAddEntryFormMode();
        loadGenerateTab(state.currentCategory);
        toast('已刪除');
      }).catch(function (err) { toast(err.message, true); });
    });
  });
  $all('button[data-act="reset"]', tbody).forEach(function (btn) {
    btn.addEventListener('click', function () {
      runAsync('resetGenerationStatus', catRef.spreadsheetId, catRef.key, parseInt(btn.dataset.row, 10)).then(function (data) {
        state.rows = data.rows; state.headers = data.headers;
        renderListTable();
        loadGenerateTab(state.currentCategory);
        toast('已重設為未產生，可重新輸出');
      }).catch(function (err) { toast(err.message, true); });
    });
  });
}

function renderListTable() {
  var wrap = $('#listTableWrap');
  var catRef = currentCategoryObj();
  var displayHeaders = state.headers.filter(function (h) { return h !== '圖片連結'; });
  var filters = state.listFilters || {};

  // 表頭第一列：全選 + 欄位名稱
  var theadRow1 = '<tr><th><input type="checkbox" id="checkAllRows"></th>' +
    displayHeaders.map(function (h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') + '<th>操作</th></tr>';

  // 表頭第二列：分欄位篩選框（建好後不再重建，只更新 tbody）
  var theadRow2 = '<tr class="filter-row"><th></th>' +
    displayHeaders.map(function (h) {
      var val = escapeHtml(filters[h] || '');
      return '<th><input type="text" class="col-filter" data-filter-col="' + escapeHtml(h) +
        '" value="' + val + '" placeholder="🔍" style="width:100%;box-sizing:border-box;font-size:12px;padding:2px 4px"></th>';
    }).join('') +
    '<th class="hint filter-count" style="white-space:nowrap;font-size:12px;font-weight:normal"></th></tr>';

  wrap.innerHTML = '<div class="table-scroll"><table><thead>' + theadRow1 + theadRow2 + '</thead><tbody></tbody></table></div>';

  // 全選
  $('#checkAllRows').addEventListener('change', function () {
    var visibleRows = getVisibleRows(displayHeaders);
    var checked = this.checked;
    visibleRows.forEach(function (r) {
      if (checked) state.checkedRows.add(r._rowIndex); else state.checkedRows.delete(r._rowIndex);
    });
    updateListTableBody(wrap, displayHeaders, catRef);
    updateCheckedCountUI();
  });

  // 篩選框：compositionstart/end 防止 IME 組字被打斷
  $all('.col-filter', wrap).forEach(function (inp) {
    var col = inp.dataset.filterCol;
    inp.addEventListener('compositionstart', function () { inp._composing = true; });
    inp.addEventListener('compositionend', function () {
      inp._composing = false;
      state.listFilters[col] = inp.value;
      updateListTableBody(wrap, displayHeaders, catRef);
    });
    inp.addEventListener('input', function () {
      if (inp._composing) return;
      state.listFilters[col] = inp.value;
      updateListTableBody(wrap, displayHeaders, catRef);
    });
  });

  updateListTableBody(wrap, displayHeaders, catRef);
}

function renderAddEntryForm() {
  var editableHeaders = state.headers.filter(function (h) { return ['產生狀態', '產生時間', '圖片連結'].indexOf(h) === -1; });
  var wrap = $('#addEntryFields');
  wrap.innerHTML = editableHeaders.map(function (h) {
    return '<div><label class="hint">' + escapeHtml(h) + '</label><input type="text" data-field="' + escapeHtml(h) + '" style="width:100%"></div>';
  }).join('');
}

function startEditRow(rowIndex) {
  var row = state.rows.filter(function (r) { return r._rowIndex === rowIndex; })[0];
  if (!row) return;
  state.editingRowIndex = rowIndex;
  $all('#addEntryFields input').forEach(function (inp) { inp.value = row[inp.dataset.field] != null ? row[inp.dataset.field] : ''; });
  $('#addEntryTitle').textContent = '編輯這一筆（' + (row['姓名'] || '') + '）';
  $('#btnAddEntry').textContent = '更新';
  $('#btnCancelEdit').style.display = 'inline-block';
  $('#addEntryFields').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetAddEntryFormMode() {
  state.editingRowIndex = null;
  $('#addEntryTitle').textContent = '新增一筆';
  $('#btnAddEntry').textContent = '新增';
  $('#btnCancelEdit').style.display = 'none';
  $all('#addEntryFields input').forEach(function (inp) { inp.value = ''; });
}

function submitSingleEntry() {
  var catRef = currentCategoryObj();
  if (!catRef) return;
  var obj = {};
  $all('#addEntryFields input').forEach(function (inp) { obj[inp.dataset.field] = inp.value; });
  var hasValue = Object.keys(obj).some(function (k) { return obj[k]; });
  if (!hasValue) { toast('請至少填寫一個欄位', true); return; }

  var isEditing = state.editingRowIndex !== null;
  var call = isEditing
    ? runAsync('updateNameEntry', catRef.spreadsheetId, catRef.key, state.editingRowIndex, obj)
    : runAsync('addNameEntry', catRef.spreadsheetId, catRef.key, obj);

  call.then(function (data) {
    state.rows = data.rows; state.headers = data.headers;
    renderListTable();
    resetAddEntryFormMode();
    loadGenerateTab(state.currentCategory);
    toast(isEditing ? '已更新這一筆名單' : '已新增一筆名單');
  }).catch(function (err) { toast(err.message, true); });
}

// ---- 上傳本機 Excel / CSV 檔案：解析完直接塞進「批次貼上」文字框，
// 沿用同一套預覽/確認流程，不用另外重做一次 UI。----
function handleExcelFileChosen(e) {
  var file = e.target.files[0];
  if (!file) return;
  $('#excelFileInfo').textContent = file.name;

  var ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'csv') {
    var textReader = new FileReader();
    textReader.onload = function () {
      $('#bulkPasteArea').value = String(textReader.result || '');
      parseBulkPaste();
    };
    textReader.onerror = function () { toast('讀取檔案失敗', true); };
    textReader.readAsText(file, 'utf-8');
    e.target.value = '';
    return;
  }

  if (typeof XLSX === 'undefined') {
    toast('Excel 解析套件載入失敗，請改用「批次貼上」貼上內容，或另存成 CSV 再上傳', true);
    e.target.value = '';
    return;
  }
  var binReader = new FileReader();
  binReader.onload = function () {
    try {
      // 一律直接讀取第一個工作表的第一列當標題，不特別支援多分頁選擇——
      // 檔案裡如果有其他分頁，請先在 Excel/Google 試算表裡另存成只有一個工作表的檔案。
      var workbook = XLSX.read(new Uint8Array(binReader.result), { type: 'array' });
      var ws = workbook.Sheets[workbook.SheetNames[0]];
      var tsv = XLSX.utils.sheet_to_csv(ws, { FS: '\t', blankrows: false });
      $('#bulkPasteArea').value = tsv;
      parseBulkPaste();
    } catch (err) {
      toast('無法解析這個檔案：' + err.message, true);
    }
  };
  binReader.onerror = function () { toast('讀取檔案失敗', true); };
  binReader.readAsArrayBuffer(file);
  e.target.value = '';
}

function parseBulkPaste() {
  var raw = $('#bulkPasteArea').value;
  if (!raw.trim()) { toast('請先貼上資料', true); return; }
  var lines = raw.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim() !== ''; });
  if (!lines.length) { toast('沒有有效資料', true); return; }
  var delim = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
  var editableHeaders = state.headers.filter(function (h) { return ['產生狀態', '產生時間', '圖片連結'].indexOf(h) === -1; });

  var firstCells = lines[0].split(delim).map(function (s) { return s.trim(); });
  // 第一列的所有非空格子都能對到系統欄位 → 判定為標題列
  var nonEmpty = firstCells.filter(function (c) { return c; });
  var looksLikeHeader = nonEmpty.length > 0 && nonEmpty.every(function (c) { return editableHeaders.indexOf(c) !== -1; });

  state._pendingBulkRaw = { lines: lines, delim: delim, firstCells: firstCells };

  var totalRows = looksLikeHeader ? lines.length - 1 : lines.length;
  var mappingRows = firstCells.map(function (cell, i) {
    var label = looksLikeHeader ? escapeHtml(cell) : ('欄 ' + (i + 1) + (cell ? '（' + escapeHtml(cell) + '）' : ''));
    var autoMatch = editableHeaders.indexOf(cell) !== -1 ? cell : '';
    var options = '<option value="">（略過）</option>' +
      editableHeaders.map(function (h) {
        return '<option value="' + escapeHtml(h) + '"' + (h === autoMatch ? ' selected' : '') + '>' + escapeHtml(h) + '</option>';
      }).join('');
    return '<tr>' +
      '<td style="padding:4px 10px 4px 0;font-size:13px">' + label + '</td>' +
      '<td><select data-bulk-col="' + i + '" style="width:100%">' + options + '</select></td>' +
      '</tr>';
  }).join('');

  var mappingDiv = $('#bulkMapping');
  mappingDiv.style.display = 'block';
  mappingDiv.innerHTML =
    '<div style="margin-bottom:8px">' +
      '<label><input type="checkbox" id="bulkFirstRowIsHeader"' + (looksLikeHeader ? ' checked' : '') + '> 第一列是欄位名稱（不匯入為資料）</label>' +
    '</div>' +

}

function confirmBulkImport() {
  var raw = state._pendingBulkRaw;
  if (!raw) { toast('請先解析資料', true); return; }
  var catRef = currentCategoryObj();
  if (!catRef) return;

  var isHeader = !!($('#bulkFirstRowIsHeader') && $('#bulkFirstRowIsHeader').checked);
  var dataLines = isHeader ? raw.lines.slice(1) : raw.lines;

  // 從對應 UI 收集欄位對應
  var colMap = {};
  $all('select[data-bulk-col]', $('#bulkMapping')).forEach(function (sel) {
    var fieldName = sel.value;
    if (fieldName) colMap[parseInt(sel.dataset.bulkCol, 10)] = fieldName;
  });

  var parsed = dataLines.map(function (line) {
    var cells = line.split(raw.delim);
    var obj = {};
    Object.keys(colMap).forEach(function (i) {
      obj[colMap[i]] = (cells[parseInt(i, 10)] || '').trim();
    });
    return obj;
  }).filter(function (o) { return Object.keys(o).some(function (k) { return o[k]; }); });

  if (!parsed.length) { toast('沒有有效資料可匯入（請確認欄位對應）', true); return; }

  // 重複偵測
  var systemFields = ['產生狀態', '產生時間', '圖片連結', '_rowIndex'];
  var dataFields = state.headers.filter(function (h) { return systemFields.indexOf(h) === -1; });
  var rowKey = function (r) { return dataFields.map(function (h) { return String(r[h] || '').trim(); }).join('\x00'); };
  var existingKeys = {};
  state.rows.forEach(function (r) { existingKeys[rowKey(r)] = true; });
  var dupNames = parsed.filter(function (r) { return existingKeys[rowKey(r)]; })
    .map(function (r) { return r[dataFields[0]] || '（空白）'; });
  if (dupNames.length) {
    var msg = '偵測到 ' + dupNames.length + ' 筆資料與現有名單重複：\n' +
      dupNames.slice(0, 10).join('、') + (dupNames.length > 10 ? '…等' : '') +
      '\n\n要繼續匯入（含重複）嗎？';
    if (!confirm(msg)) return;
  }

  busy($('#btnConfirmBulk'), true);
  runAsync('addNameEntriesBulk', catRef.spreadsheetId, catRef.key, parsed).then(function (data) {
    state.rows = data.rows; state.headers = data.headers;
    renderListTable();
    $('#bulkPasteArea').value = '';
    $('#bulkPreview').innerHTML = '';
    $('#bulkMapping').style.display = 'none';
    $('#btnConfirmBulk').style.display = 'none';
    state._pendingBulkRaw = null;
    loadGenerateTab(state.currentCategory);
    toast('已匯入 ' + parsed.length + ' 筆名單');
  }).catch(function (err) { toast(err.message, true); }).finally(function () { busy($('#btnConfirmBulk'), false); });
}

function loadImageFromBase64(base64, mimeType) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = reject;
    img.src = 'data:' + mimeType + ';base64,' + base64;
  });
}

function imgPctToDisplay(pct, dim, unit) {
  var f = state.layout && state.layout[state.selectedFieldIndex];
  var natPx = dim === 'W' ? (f && f.natW) : (f && f.natH);
  if (unit === 'px') {
    if (!natPx) return Math.round(pct * 10) / 10;
    return Math.round(pct / 100 * natPx);
  }
  if (unit === 'cm') {
    if (!natPx) return Math.round(pct * 10) / 10;
    var bgPx    = dim === 'W' ? (state.bgNativeW || 1000) : (state.bgNativeH || 1000);
    var badgeMm = dim === 'W' ? parseFloat($('#pdfBadgeW').value) : parseFloat($('#pdfBadgeH').value);
    if (!badgeMm) return Math.round(pct * 10) / 10;
    return Math.round(pct / 100 * natPx / bgPx * badgeMm / 10 * 100) / 100;
  }
  return Math.round(pct * 10) / 10;
}

function imgDisplayToPct(val, dim, unit) {
  var f = state.layout && state.layout[state.selectedFieldIndex];
  var natPx = dim === 'W' ? (f && f.natW) : (f && f.natH);
  if (unit === 'px') {
    if (!natPx) return val;
    return val / natPx * 100;
  }
  if (unit === 'cm') {
    if (!natPx) return val;
    var bgPx    = dim === 'W' ? (state.bgNativeW || 1000) : (state.bgNativeH || 1000);
    var badgeMm = dim === 'W' ? parseFloat($('#pdfBadgeW').value) : parseFloat($('#pdfBadgeH').value);
    if (!badgeMm) return val;
    return val * 10 / badgeMm * bgPx / natPx * 100;
  }
  return val;
}

function getImageColumns(layout) {
  var seen = {};
  return (layout || []).filter(function (f) {
    if (f.type !== 'image') return false;
    if (seen[f.field]) return false;
    seen[f.field] = true;
    return true;
  }).map(function (f) { return f.field; });
}

function preloadRowImages(imageData) {
  var promises = [];
  var result = {};
  Object.keys(imageData || {}).forEach(function (rowIndex) {
    var cols = imageData[rowIndex];
    Object.keys(cols).forEach(function (colName) {
      var d = cols[colName];
      if (!d) return;
      var p = loadImageFromBase64(d.base64, d.mimeType).then(function (img) {
        if (!result[rowIndex]) result[rowIndex] = {};
        result[rowIndex][colName] = img;
      }).catch(function () {});
      promises.push(p);
    });
  });
  return Promise.all(promises).then(function () { return result; });
}

function renderBadgeCanvas(bgImg, nativeW, nativeH, layout, rowData, outputScale, rowImages) {
  // outputScale 預設 1（實際輸出解析度=原圖解析度）。PDF 匯出時每張名牌在紙上通常只有幾公分，
  // 用不到原圖全解析度，會傳一個 <1 的縮放比例，改用較小的畫布省記憶體與 PDF 檔案大小；
  // 版面座標／字級全部還是照 nativeW/nativeH 算，靠 ctx.scale() 統一縮放，比例不會跑掉。
  outputScale = outputScale || 1;
  var canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(nativeW * outputScale));
  canvas.height = Math.max(1, Math.round(nativeH * outputScale));
  var ctx = canvas.getContext('2d');
  ctx.scale(outputScale, outputScale);
  ctx.fillStyle = '#ffffff'; // 背景圖若有透明區域，PDF 匯出用的 JPEG 不支援透明，先鋪白色墊底避免變黑
  ctx.fillRect(0, 0, nativeW, nativeH);
  ctx.drawImage(bgImg, 0, 0, nativeW, nativeH);
  layout.forEach(function (field) {
    var text = rowData[field.field];
    if (field.type === 'image') {
      var img = rowImages && rowImages[field.field];
      if (!img) return;
      var iw = (field.widthPct  || 100) / 100 * (field.natW || img.naturalWidth  || nativeW);
      var ih = (field.heightPct || 100) / 100 * (field.natH || img.naturalHeight || nativeH);
      ctx.drawImage(img, (field.xPct / 100) * nativeW - iw / 2, (field.yPct / 100) * nativeH - ih / 2, iw, ih);
      return;
    }
    if (text === undefined || text === null || text === '') return;
    var fit = fitText(text, field, nativeW);
    ctx.font = (field.bold ? 'bold ' : '') + fit.fontSize + 'px ' + field.fontFamily;
    ctx.fillStyle = field.color || '#000000';
    ctx.textAlign = field.align || 'center';
    ctx.textBaseline = 'middle';
    var cx = (field.xPct / 100) * nativeW;
    var cy = (field.yPct / 100) * nativeH;
    var lineHeight = fit.fontSize * 1.2;
    var totalH = lineHeight * fit.lines.length;
    var startY = cy - totalH / 2 + lineHeight / 2;
    fit.lines.forEach(function (line, i) {
      ctx.fillText(line, cx, startY + i * lineHeight);
    });
  });
  return canvas;
}

function buildBadgeFilename(categoryKey, row) {
  var nameGuess = row['姓名'] || row['身分'] || row['name'] || ('row' + row._rowIndex);
  return sanitizeFilename(categoryKey + '_' + nameGuess) + '.png';
}

var generating = false;
var badgeRatioLocked = true;
var badgeLockedAspect = 90 / 110;
var badgeOrigW = null;
var badgeOrigH = null;

function generateBadges() {
  if (generating) { toast('產生作業進行中，請稍候'); return; }
  var catRef = currentCategoryObj();
  if (!catRef) return;
  var uid = state.currentCategory;

  generating = true;
  state.cancelGeneration = false;
  var genBtn = $('#btnGenerateAndDownload');
  if (genBtn) genBtn.disabled = true;
  var cancelBtn = $('#btnCancelGen');
  if (cancelBtn) { cancelBtn.style.display = 'inline-block'; cancelBtn.disabled = false; cancelBtn.textContent = '⏹ 取消'; }

  Promise.all([runAsync('getNameList', catRef.spreadsheetId, catRef.key), runAsync('getBackgroundImageData', catRef.spreadsheetId, catRef.key), ensureFontsLoaded()])
    .then(function (results) {
      var listData = results[0];
      var bgData = results[1];
      if (!bgData) throw new Error('尚未上傳背景圖片');
      if (!bgData.layout || !bgData.layout.length) throw new Error('尚未設定任何欄位版面');

      var rows = getRowsByScope(listData.rows);
      if (!rows.length) {
        var scopeMsg = state.exportScope === 'pending' ? '目前沒有未產生的名單' :
                       state.exportScope === 'checked' ? '請先在「名單管理」勾選要處理的名單' : '名單是空的';
        toast(scopeMsg, true);
        return null;
      }

      var imgCols = getImageColumns(bgData.layout);
      var imagesPromise = imgCols.length
        ? runAsync('getRowImageData', catRef.spreadsheetId, catRef.key, imgCols).then(preloadRowImages)
        : Promise.resolve({});
      return Promise.all([loadImageFromBase64(bgData.base64, bgData.mimeType), imagesPromise]).then(function (r) {
        return runGenerationLoop(catRef, rows, r[0], bgData.width, bgData.height, bgData.layout, r[1]);
      });
    })
    .then(function (result) {
      if (!result || result.count === 0) return;
      downloadZip();
      var rowIndexes = state.lastGenerated.map(function (item) { return item.rowIndex; }).filter(function (i) { return i >= 0; });
      if (!rowIndexes.length) return;
      var saveToDrive = $('#chkSavePngToDrive') && $('#chkSavePngToDrive').checked;
      if (saveToDrive) {
        return runDriveSaveLoop(catRef); // saveGeneratedBadge 內部已標記已產生
      }
      return runAsync('markRowsGenerated', catRef.spreadsheetId, catRef.key, rowIndexes, 'PNG 下載')
        .catch(function () {});
    })
    .catch(function (err) {
      if (!state.cancelGeneration) toast(err.message, true);
    })
    .finally(function () {
      generating = false;
      state.cancelGeneration = false;
      if (genBtn) genBtn.disabled = false;
      if (cancelBtn) cancelBtn.style.display = 'none';
      loadGenerateTab(uid);
      updateCheckedCountUI();
    });
}

function runGenerationLoop(catRef, rows, bgImg, w, h, layout, preloadedImages) {
  var progressWrap = $('#progressWrap');
  var bar = $('#progressBar');
  var label = $('#progressLabel');
  progressWrap.style.display = 'block';
  state.lastGenerated = [];
  $('#gallery').innerHTML = '';

  var i = 0;
  function next() {
    if (state.cancelGeneration) {
      progressWrap.style.display = 'none';
      toast('已取消，共渲染 ' + i + ' 張');
      return Promise.resolve({ count: i, cancelled: true });
    }
    if (i >= rows.length) {
      bar.style.width = '100%';
      progressWrap.style.display = 'none';
      return Promise.resolve({ count: i, cancelled: false });
    }
    var row = rows[i];
    bar.style.width = Math.round((i / rows.length) * 100) + '%';
    label.textContent = '渲染中… (' + (i + 1) + ' / ' + rows.length + ') ' + (row['姓名'] || '');

    var canvas = renderBadgeCanvas(bgImg, w, h, layout, row, 1, (preloadedImages || {})[row._rowIndex] || {});
    var dataUrl = canvas.toDataURL('image/png');
    var filename = buildBadgeFilename(catRef.key, row);
    state.lastGenerated.push({ filename: filename, dataUrl: dataUrl, rowIndex: row._rowIndex });
    addGalleryItem(dataUrl, filename);
    i++;
    return new Promise(function (res) { setTimeout(res, 0); }).then(next);
  }
  return next();
}

function addGalleryItem(dataUrl, filename) {
  var gallery = $('#gallery');
  var div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = '<img src="' + dataUrl + '"><div class="fn">' + escapeHtml(filename) + '</div>';
  gallery.appendChild(div);
}

function downloadZip() {
  if (!state.lastGenerated.length) { toast('請先產生名牌', true); return; }
  if (typeof JSZip === 'undefined') { toast('ZIP 套件載入失敗，請重新整理頁面後再試', true); return; }
  var zip = new JSZip();
  state.lastGenerated.forEach(function (item) {
    zip.file(item.filename, item.dataUrl.split(',')[1], { base64: true });
  });
  zip.generateAsync({ type: 'blob' }).then(function (blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var cat = currentCategoryObj();
    a.download = sanitizeFilename(cat ? cat.key : 'badge') + '_名牌.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

function openDriveFolder() {
  var cat = currentCategoryObj();
  if (!cat) return;
  runAsync('getOutputFolderUrl', cat.spreadsheetId, cat.key)
    .then(function (url) { window.open(url, '_blank'); })
    .catch(function (err) { toast(err.message, true); });
}

function toggleBadgeRatioLock() {

    badgeLockedAspect = null;

function updateRestoreBtnState() {
  var btn = $('#btnRestoreBadgeRatio');
  if (!btn) return;
  var w = parseFloat($('#pdfBadgeW').value);
  var h = parseFloat($('#pdfBadgeH').value);

function restoreBadgeRatio() {
  if (badgeOrigW == null || badgeOrigH == null) {
    toast('尚未載入背景圖片尺寸', true);
    return;
  }
  $('#pdfBadgeW').value = badgeOrigW;
  $('#pdfBadgeH').value = badgeOrigH;
  if (badgeRatioLocked) badgeLockedAspect = badgeOrigW / badgeOrigH;

function runDriveSaveLoop(catRef) {
  var progressWrap = $('#progressWrap');
  var bar = $('#progressBar');
  var label = $('#progressLabel');
  progressWrap.style.display = 'block';
  var items = state.lastGenerated.filter(function (item) { return item.rowIndex >= 0; });
  var i = 0;
  function next() {
    if (i >= items.length) {
      progressWrap.style.display = 'none';
      toast('已儲存 ' + items.length + ' 張名牌至 Google Drive');
      return Promise.resolve();
    }
    var item = items[i];
    bar.style.width = Math.round((i / items.length) * 100) + '%';
    label.textContent = '儲存至 Drive… (' + (i + 1) + ' / ' + items.length + ') ' + item.filename;
    return runAsync('saveGeneratedBadge', catRef.spreadsheetId, catRef.key, item.rowIndex, item.dataUrl.split(',')[1], item.filename)
      .then(function () { i++; return next(); });
  }
  return next();
}

function clearAllGenerationStatus() {

  if (!confirm('確定要清除此類別全部的已產生紀錄嗎？\n（此動作不可復原；下載的檔案不受影響）')) return;
  runAsync('resetAllGenerationStatus', catRef.spreadsheetId, catRef.key).then(function () {
    toast('已清除全部生成紀錄');
    loadGenerateTab(state.currentCategory);
    if ($('#tab-list').classList.contains('active')) loadNameListTab(state.currentCategory);
  }).catch(function (err) { toast(err.message, true); });
}

// ============================================================
var PDF_PAGE_PRESETS = { A4: { w: 210, h: 297 }, Letter: { w: 215.9, h: 279.4 } };
var PDF_TARGET_DPI = 200; // 印刷用途足夠清楚，同時避免原圖解析度太高時單頁 PDF 爆量
var pdfExporting = false;

function onPdfPageSizeChanged() {
  var isCustom = $('#pdfPageSize').value === 'custom';
  $('#pdfCustomSizeWrap').style.display = isCustom ? 'inline-block' : 'none';
  $('#pdfOrientationWrap').style.display = isCustom ? 'none' : 'inline-block';
}

function getPdfPageSizeMm() {
  var preset = $('#pdfPageSize').value;
  if (preset === 'custom') {
    var w = parseFloat($('#pdfCustomW').value);
    var h = parseFloat($('#pdfCustomH').value);
    if (!w || !h || w <= 0 || h <= 0) throw new Error('請輸入正確的自訂紙張寬高（mm）');
    return { w: w, h: h };
  }
  var base = PDF_PAGE_PRESETS[preset];
  var landscape = $('#pdfOrientation').value === 'landscape';
  return landscape ? { w: base.h, h: base.w } : { w: base.w, h: base.h };
}

// 依背景圖片的實際長寬比，計算「不旋轉」和「旋轉 90°」兩種擺法各能在一頁塞幾個，
// 挑張數多的那種。格子尺寸以「名牌實際印出大小」為準（圖片長寬比 contain 到
// badgeW×badgeH 後的大小），間距也依此計算，不浪費空白行。
function computeBadgeGrid(pageW, pageH, margin, gap, badgeW, badgeH, badgeAspect) {
  var availW = pageW - 2 * margin;
  var availH = pageH - 2 * margin;

  // 將影像 contain 到指定的最大寬高框內，回傳實際尺寸
  function containFit(maxW, maxH, aspect) {
    var w = maxW, h = maxH;
    if (w / h > aspect) { w = h * aspect; } else { h = w / aspect; }
    return { w: w, h: h };
  }

  // 不旋轉：影像 contain 在 badgeW × badgeH 內
  var normalFit = containFit(badgeW, badgeH, badgeAspect);
  // 旋轉 90°：影像先旋轉（長寬比變為 1/badgeAspect），再 contain 在 badgeH × badgeW 內
  var rotatedFit = containFit(badgeH, badgeW, 1 / badgeAspect);

  function tryFit(slotW, slotH) {
    var cols = Math.max(0, Math.floor((availW + gap) / (slotW + gap)));
    var rows = Math.max(0, Math.floor((availH + gap) / (slotH + gap)));
    return { cols: cols, rows: rows, count: cols * rows };
  }

  var normalGrid = tryFit(normalFit.w, normalFit.h);
  var rotatedGrid = tryFit(rotatedFit.w, rotatedFit.h);
  var rotate = rotatedGrid.count > normalGrid.count;
  var chosenGrid = rotate ? rotatedGrid : normalGrid;
  var chosenFit = rotate ? rotatedFit : normalFit;

  if (!chosenGrid.count) throw new Error('這個名牌尺寸太大，一頁連一個都放不下，請調小名牌尺寸或邊界/間距');

  var slots = [];
  for (var r = 0; r < chosenGrid.rows; r++) {
    for (var c = 0; c < chosenGrid.cols; c++) {
      slots.push({
        x: margin + c * (chosenFit.w + gap),
        y: margin + r * (chosenFit.h + gap),
        w: chosenFit.w, h: chosenFit.h,
        rotate: rotate
      });
    }
  }
  return slots;
}

function rotateCanvas90(sourceCanvas) {
  var rotated = document.createElement('canvas');
  rotated.width = sourceCanvas.height;
  rotated.height = sourceCanvas.width;
  var ctx = rotated.getContext('2d');
  ctx.translate(rotated.width / 2, rotated.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(sourceCanvas, -sourceCanvas.width / 2, -sourceCanvas.height / 2);
  return rotated;
}

function exportPdf() {
  if (pdfExporting) { toast('PDF 產生中，請稍候'); return; }
  var catRef = currentCategoryObj();
  if (!catRef) return;
  if (typeof window.jspdf === 'undefined') { toast('PDF 套件載入失敗，請檢查網路連線後重新整理頁面', true); return; }

  var badgeW = parseFloat($('#pdfBadgeW').value);
  var badgeH = parseFloat($('#pdfBadgeH').value);
  if (!badgeW || !badgeH || badgeW <= 0 || badgeH <= 0) { toast('請輸入正確的名牌寬高（mm）', true); return; }
  var gap = parseFloat($('#pdfGap').value) || 0;
  var margin = parseFloat($('#pdfMargin').value) || 0;
  var blankCount = Math.max(0, parseInt($('#pdfBlankCount').value) || 0);
  var pageSize;
  try { pageSize = getPdfPageSizeMm(); } catch (err) { toast(err.message, true); return; }

  pdfExporting = true;
  busy($('#btnExportPdf'), true);

  Promise.all([runAsync('getNameList', catRef.spreadsheetId, catRef.key), runAsync('getBackgroundImageData', catRef.spreadsheetId, catRef.key), ensureFontsLoaded()])
    .then(function (results) {
      var listData = results[0];
      var bgData = results[1];
      if (!bgData) throw new Error('尚未上傳背景圖片');
      if (!bgData.layout || !bgData.layout.length) throw new Error('尚未設定任何欄位版面');

      var rowsData = getRowsByScope(listData.rows);
      // 額外空白名牌（_rowIndex 用負數識別，不會被標記為已產生）
      var blankRows = [];
      for (var b = 0; b < blankCount; b++) blankRows.push({ _rowIndex: -(b + 1) });
      var allRows = rowsData.concat(blankRows);
      if (!allRows.length) throw new Error('沒有符合條件的名單（請確認名單是否為空，或勾選特定幾筆，或增加額外空白名牌數量）');

      var slots = computeBadgeGrid(pageSize.w, pageSize.h, margin, gap, badgeW, badgeH, bgData.width / bgData.height);
      var firstSlot = slots[0];
      var targetPxW = (firstSlot.w / 25.4) * PDF_TARGET_DPI;
      // 旋轉後的畫布寬對應的是原圖的高（nativeH），需用對應維度算縮放比
      var outputScale = firstSlot.rotate ? (targetPxW / bgData.height) : (targetPxW / bgData.width);

      var pdfImgCols = getImageColumns(bgData.layout);
      var pdfImagesPromise = pdfImgCols.length
        ? runAsync('getRowImageData', catRef.spreadsheetId, catRef.key, pdfImgCols).then(preloadRowImages)
        : Promise.resolve({});
      return Promise.all([loadImageFromBase64(bgData.base64, bgData.mimeType), pdfImagesPromise]).then(function (pr) {
        return runPdfExportLoop(catRef, allRows, pr[0], bgData.width, bgData.height, bgData.layout, pageSize, slots, outputScale, blankCount, pr[1]);
      }).then(function (loopResult) {
        var filename = sanitizeFilename(catRef.key) + '_名牌.pdf';
        loopResult.pdf.save(filename);
        var realCount = allRows.length - blankCount;
        var blankMsg = blankCount ? ('＋' + blankCount + ' 張空白') : '';
        toast('PDF 已產生，共 ' + realCount + ' 張命名名牌' + blankMsg + '、' +
          Math.ceil(allRows.length / loopResult.perPage) + ' 頁（每頁 ' + loopResult.perPage + ' 個）');
        var chain = markRowsGeneratedAfterPdf(catRef, loopResult.doneRowIndexes);
        if ($('#chkSavePdfToDrive') && $('#chkSavePdfToDrive').checked) {
          chain = chain.then(function () {
            $('#pdfProgressLabel').textContent = 'PDF 上傳至 Drive 中…';
            $('#pdfProgressWrap').style.display = 'block';
            var base64 = loopResult.pdf.output('datauristring').split(',')[1];
            return runAsync('savePdfToDrive', catRef.spreadsheetId, catRef.key, base64, filename)
              .then(function () { toast('PDF 已儲存至 Google Drive'); })
              .catch(function (err) { toast('PDF 已下載，但 Drive 儲存失敗：' + err.message, true); })
              .finally(function () { $('#pdfProgressWrap').style.display = 'none'; });
          });
        }
        return chain;
      });
    })
    .catch(function (err) { toast(err.message, true); })
    .finally(function () {
      pdfExporting = false;
      busy($('#btnExportPdf'), false);
      $('#pdfProgressWrap').style.display = 'none';
    });
}

function runPdfExportLoop(catRef, rows, bgImg, w, h, layout, pageSize, slots, outputScale, blankCount, preloadedImages) {
  var progressWrap = $('#pdfProgressWrap');
  var bar = $('#pdfProgressBar');
  var label = $('#pdfProgressLabel');
  progressWrap.style.display = 'block';

  var perPage = slots.length;
  // 紙張是直是橫，要明確告訴 jsPDF，不然它只認 format 陣列裡的數字、預設仍當直式處理
  var orientation = pageSize.w > pageSize.h ? 'landscape' : 'portrait';
  var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: [pageSize.w, pageSize.h], orientation: orientation });
  var doneRowIndexes = [];

  var i = 0;
  function next() {
    if (i >= rows.length) {
      progressWrap.style.display = 'none';
      return Promise.resolve({ pdf: pdf, doneRowIndexes: doneRowIndexes, perPage: perPage });
    }
    var row = rows[i];
    var isBlank = row._rowIndex < 0;
    label.textContent = '排版中… (' + (i + 1) + ' / ' + rows.length + ') ' + (isBlank ? '空白名牌' : (row['姓名'] || ''));
    bar.style.width = Math.round((i / rows.length) * 100) + '%';

    var slotIdx = i % perPage;
    if (i > 0 && slotIdx === 0) pdf.addPage([pageSize.w, pageSize.h], orientation);
    var slot = slots[slotIdx];

    // 空白名牌傳空物件，renderBadgeCanvas 會跳過所有欄位只保留背景
    var rowImgs = isBlank ? {} : ((preloadedImages || {})[row._rowIndex] || {});
    var canvas = renderBadgeCanvas(bgImg, w, h, layout, isBlank ? {} : row, outputScale, rowImgs);
    if (slot.rotate) canvas = rotateCanvas90(canvas);
    var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(dataUrl, 'JPEG', slot.x, slot.y, slot.w, slot.h);
    if (!isBlank) doneRowIndexes.push(row._rowIndex);

    i++;
    return new Promise(function (res) { setTimeout(res, 0); }).then(next);
  }
  return next();
}

function markRowsGeneratedAfterPdf(catRef, rowIndexes) {
  // 過濾掉空白名牌（負數 index），只標記真實名單列
  var realIndexes = rowIndexes.filter(function (idx) { return idx >= 0; });
  if (!realIndexes.length) return Promise.resolve();
  var uid = categoryUid(catRef.spreadsheetId, catRef.key);
  return runAsync('markRowsGenerated', catRef.spreadsheetId, catRef.key, realIndexes, 'PDF 匯出').then(function () {
    if (state.currentCategory === uid) {
      loadGenerateTab(uid);
      if (document.getElementById('tab-list').classList.contains('active')) loadNameListTab(uid);
    }
  }).catch(function (err) { toast('PDF 已下載，但更新產生狀態時發生錯誤：' + err.message, true); });
}

// ============================================================
// PDF 版面預覽
// ============================================================
function markPdfPreviewStale() {
  var stale = $('#pdfPreviewStale');
  if (stale) stale.style.display = 'inline';
}

function drawPdfFirstPagePreview(pageW, pageH, margin, slots, bgImg, bgW, bgH, layout, rows, blankCount, preloadedImages) {
  var canvas = $('#pdfLayoutCanvas');
  var maxW = 360, maxH = 480;
  var ps = Math.min(maxW / pageW, maxH / pageH);
  canvas.width = Math.round(pageW * ps);
  canvas.height = Math.round(pageH * ps);
  var ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 邊界虛線
  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(margin * ps, margin * ps, (pageW - 2 * margin) * ps, (pageH - 2 * margin) * ps);
  ctx.setLineDash([]);

  var total = rows.length + blankCount;
  slots.forEach(function (slot, i) {
    if (i >= total) return;
    var rowData = i < rows.length ? rows[i] : {};
    var slotPxW = slot.w * ps;
    var slotPxH = slot.h * ps;
    var outputScale = slotPxW / (slot.rotate ? bgH : bgW);
    var rowImgs = rowData._rowIndex ? ((preloadedImages || {})[rowData._rowIndex] || {}) : {};
    var badgeCanvas = renderBadgeCanvas(bgImg, bgW, bgH, layout, rowData, outputScale, rowImgs);
    var sx = slot.x * ps, sy = slot.y * ps;
    if (slot.rotate) {
      ctx.drawImage(rotateCanvas90(badgeCanvas), sx, sy, slotPxW, slotPxH);
    } else {
      ctx.drawImage(badgeCanvas, sx, sy, slotPxW, slotPxH);
    }
  });

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
}

function previewPdfLayout() {
  var catRef = currentCategoryObj();
  if (!catRef) { toast('請先選擇類別', true); return; }

  var badgeW = parseFloat($('#pdfBadgeW').value);
  var badgeH = parseFloat($('#pdfBadgeH').value);
  if (!badgeW || !badgeH || badgeW <= 0 || badgeH <= 0) { toast('請輸入正確的名牌寬高（mm）', true); return; }
  var gap = parseFloat($('#pdfGap').value) || 0;
  var margin = parseFloat($('#pdfMargin').value) || 0;
  var blankCount = Math.max(0, parseInt($('#pdfBlankCount').value) || 0);
  var pageSize;
  try { pageSize = getPdfPageSizeMm(); } catch (err) { toast(err.message, true); return; }

  busy($('#btnPreviewPdf'), true);

  Promise.all([
    runAsync('getNameList', catRef.spreadsheetId, catRef.key),
    runAsync('getBackgroundImageData', catRef.spreadsheetId, catRef.key),
    ensureFontsLoaded()
  ]).then(function (results) {
    var listData = results[0];
    var bgData = results[1];
    if (!bgData) throw new Error('尚未上傳背景圖片');

    var slots = computeBadgeGrid(pageSize.w, pageSize.h, margin, gap, badgeW, badgeH, bgData.width / bgData.height);
    var firstSlot = slots[0];
    var rotate = firstSlot.rotate;

    // 顯示預覽區
    $('#pdfPreviewSection').style.display = 'block';
    $('#pdfPreviewStale').style.display = 'none';

    // 統計資訊
    var rowsData = getRowsByScope(listData.rows);
    var totalBadges = rowsData.length + blankCount;
    var totalPages = Math.ceil(totalBadges / slots.length);
    $('#pdfLayoutStats').innerHTML =
      '<table style="font-size:12.5px;border-collapse:collapse">' +
      '<tr><td style="color:var(--text-soft);padding:3px 10px 3px 0">每頁名牌數</td><td><strong>' + slots.length + ' 個</strong></td></tr>' +
      '<tr><td style="color:var(--text-soft);padding:3px 10px 3px 0">格子尺寸</td><td><strong>' + firstSlot.w.toFixed(1) + '&times;' + firstSlot.h.toFixed(1) + ' mm</strong></td></tr>' +
      '<tr><td style="color:var(--text-soft);padding:3px 10px 3px 0">名牌旋轉</td><td><strong>' + (rotate ? '是（旋轉 90° 以排更多）' : '否') + '</strong></td></tr>' +
      '<tr><td style="color:var(--text-soft);padding:3px 10px 3px 0">名單筆數</td><td><strong>' + rowsData.length + ' 筆' + (blankCount ? '＋' + blankCount + ' 空白' : '') + '</strong></td></tr>' +
      '<tr><td style="color:var(--text-soft);padding:3px 10px 3px 0">預計頁數</td><td><strong>' + totalPages + ' 頁</strong></td></tr>' +
      '<tr><td style="color:var(--text-soft);padding:3px 10px 3px 0">紙張</td><td><strong>' + pageSize.w + '&times;' + pageSize.h + ' mm</strong></td></tr>' +
      '</table>';

    // 實際渲染第一頁預覽
    var layout = bgData.layout && bgData.layout.length ? bgData.layout : state.layout;
    var previewImgCols = getImageColumns(layout);
    var previewRows = rowsData.slice(0, slots.length); // 只取第一頁用到的列
    var previewImagesPromise = previewImgCols.length
      ? runAsync('getRowImageData', catRef.spreadsheetId, catRef.key, previewImgCols).then(preloadRowImages)
      : Promise.resolve({});
    return Promise.all([loadImageFromBase64(bgData.base64, bgData.mimeType), previewImagesPromise]).then(function (pr) {
      drawPdfFirstPagePreview(pageSize.w, pageSize.h, margin, slots, pr[0], bgData.width, bgData.height, layout, previewRows, blankCount, pr[1]);
    });

  }).catch(function (err) { toast(err.message, true); })
    .finally(function () { busy($('#btnPreviewPdf'), false); });
}

// 下載空白版型 PDF（僅背景圖、無文字），使用 PDF 匯出頁的紙張 / 名牌尺寸設定，一頁排滿
function downloadBlankBadgePdf() {
  if (pdfExporting) { toast('PDF 產生中，請稍候'); return; }
  var catRef = currentCategoryObj();
  if (!catRef) { toast('請先選擇類別', true); return; }
  if (typeof window.jspdf === 'undefined') { toast('PDF 套件載入失敗，請重新整理頁面', true); return; }

  var badgeW = parseFloat($('#pdfBadgeW').value);
  var badgeH = parseFloat($('#pdfBadgeH').value);
  if (!badgeW || !badgeH || badgeW <= 0 || badgeH <= 0) { toast('請輸入正確的名牌寬高（mm）', true); return; }
  var gap = parseFloat($('#pdfGap').value) || 0;
  var margin = parseFloat($('#pdfMargin').value) || 0;
  var pageSize;
  try { pageSize = getPdfPageSizeMm(); } catch (err) { toast(err.message, true); return; }

  pdfExporting = true;
  busy($('#btnDownloadBlankPdf'), true);

  Promise.all([runAsync('getBackgroundImageData', catRef.spreadsheetId, catRef.key), ensureFontsLoaded()])
    .then(function (results) {
      var bgData = results[0];
      if (!bgData) throw new Error('尚未上傳背景圖片');

      var slots = computeBadgeGrid(pageSize.w, pageSize.h, margin, gap, badgeW, badgeH, bgData.width / bgData.height);
      var firstSlot = slots[0];
      var targetPxW = (firstSlot.w / 25.4) * PDF_TARGET_DPI;
      var outputScale = firstSlot.rotate ? (targetPxW / bgData.height) : (targetPxW / bgData.width);

      return loadImageFromBase64(bgData.base64, bgData.mimeType).then(function (img) {
        var orientation = pageSize.w > pageSize.h ? 'landscape' : 'portrait';
        var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: [pageSize.w, pageSize.h], orientation: orientation });

        // 空白畫布只有背景，layout 傳空陣列
        var blankCanvas = renderBadgeCanvas(img, bgData.width, bgData.height, [], {}, outputScale);
        var blankCanvasRotated = rotateCanvas90(blankCanvas);

        slots.forEach(function (slot) {
          var dataUrl = (slot.rotate ? blankCanvasRotated : blankCanvas).toDataURL('image/jpeg', 0.92);
          pdf.addImage(dataUrl, 'JPEG', slot.x, slot.y, slot.w, slot.h);
        });

        pdf.save(sanitizeFilename(catRef.key) + '_空白版型.pdf');
        toast('已下載空白版型 PDF（一頁共 ' + slots.length + ' 個）');
      });
    })
    .catch(function (err) { toast(err.message, true); })
    .finally(function () {
      pdfExporting = false;
      busy($('#btnDownloadBlankPdf'), false);
    });
}
